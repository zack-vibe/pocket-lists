    function normalizeGroceryItemKey(rawText) {
      return String(rawText || '')
        .toLowerCase()
        .replace(/^\s*[\d¼½¾⅓⅔⅛⅜⅝⅞/.\-–]+\s*(?:lbs?|oz|g|kg|cups?|tbsp|tsp|cans?|bags?|packs?|packages?|boxes?|bunches?|heads?|blocks?|bottles?|jars?|pints?|quarts?|gallons?|cloves?)?\b\s*(?:of\b\s*)?/i, '')
        .replace(/[^a-z0-9\s]/g, ' ')
        .replace(/\s+/g, ' ')
        .trim();
    }

    function buildWholePhraseRegex(phrase) {
      const escaped = phrase.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      if (escaped.endsWith('y') && escaped.length > 2 && !/[aeiou]y$/i.test(escaped)) {
        return new RegExp(`\\b${escaped.slice(0, -1)}(?:y|ies)\\b`, 'i');
      }
      return new RegExp(`\\b${escaped}(?:s|es)?\\b`, 'i');
    }

    function inferGrocerySection(rawText) {
      const lower = String(rawText || '').toLowerCase();
      if (!lower.trim()) return null;

      // 1. Check user-learned aisle overrides first
      const normKey = normalizeGroceryItemKey(rawText);
      if (normKey && uiPrefs.learnedAisles && uiPrefs.learnedAisles[normKey]) {
        return uiPrefs.learnedAisles[normKey];
      }

      // 2. Explicit modifiers override ingredient family
      if (/\bfrozen\b/i.test(lower)) return 'Frozen & Refrigerated';
      if (/\b(?:canned|dried)\b/i.test(lower)) return 'Dry Goods / Pantry';

      // 3. Longest whole-word phrase match wins ("tomato paste" > "tomato", "peanut butter" > "butter", "corn" != "cornstarch")
      let bestSection = null;
      let bestScore = 0;

      for (const group of AISLE_KEYWORDS) {
        for (const w of group.words) {
          if (w.length <= bestScore) continue;
          if (buildWholePhraseRegex(w).test(lower)) {
            bestScore = w.length;
            bestSection = group.section;
          }
        }
      }
      return bestSection;
    }

      document.getElementById('grocery-progress-text').textContent = `${checkedCount} of ${total} checked`;
      document.getElementById('grocery-remaining-text').textContent = `${leftCount} left`;
      document.getElementById('grocery-progress-fill').style.width = `${pct}%`;

      const hideBtn = document.getElementById('toggle-hide-checked-btn');
      hideBtn.textContent = uiPrefs.hideCheckedGrocery ? 'Show Checked' : 'Hide Checked';

      const clearBtn = document.getElementById('clear-checked-btn');
      if (clearBtn) {
        clearBtn.style.display = checkedCount > 0 ? 'inline-flex' : 'none';
        clearBtn.textContent = `Clear Checked (${checkedCount})`;
      }

      const container = document.getElementById('grocery-sections-container');
      const visibleItems = uiPrefs.hideCheckedGrocery ? items.filter(i => !i.checked) : items;

      if (visibleItems.length === 0) {
        container.innerHTML = `<div class="empty-state">${total > 0 ? 'All grocery items are checked off! 🎉' : 'Your grocery list is empty. Add an item above or ask Gemini on your PC!'}</div>`;
        return;

      const groups = new Map();
      for (const sec of SECTION_ORDER) groups.set(sec, []);
      for (const item of visibleItems) {
        const sec = item.section || 'Dry Goods / Pantry';
        if (!groups.has(sec)) groups.set(sec, []);
        groups.get(sec).push(item);
      }

      let html = '';
      for (const [secName, secItems] of groups.entries()) {
        if (secItems.length === 0) continue;
        const sorted = [...secItems].sort((a, b) => Number(a.checked) - Number(b.checked));
        const uncheckedInSec = secItems.filter(i => !i.checked).length;
        const isCollapsed = Boolean(uiPrefs.collapsedSections[secName]);

        html += `
          <div class="section-block ${isCollapsed ? 'collapsed' : ''}">
            <div class="section-header" data-action="toggle-grocery-section" data-section="${escapeHtml(secName)}">
              <div class="section-title-wrap">
                <span>${isCollapsed ? '▸' : '▾'}</span>
                <span>${escapeHtml(secName)}</span>
              </div>
              <span class="section-count">${uncheckedInSec} left</span>
            </div>
            <div class="section-items">
              ${sorted.map(item => `
                <div class="grocery-row ${item.checked ? 'checked' : ''}" data-action="toggle-grocery-item" data-id="${escapeHtml(item.id)}">
                  <div class="checkbox-ui">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><polyline points="20 6 9 17 4 12"></polyline></svg>
                  </div>
                  <div class="grocery-text">${escapeHtml(item.item)}</div>
                </div>
              `).join('')}
            </div>
          </div>
        `;
      }
      container.innerHTML = html;
    }

    function toggleGrocerySection(secName) {
      uiPrefs.collapsedSections[secName] = !uiPrefs.collapsedSections[secName];
      saveLocalState();
      renderGroceryView();
    }

    function toggleGroceryItem(id) {
      const item = appState.grocery.find(x => x.id === id);
      if (!item) return;
      item.checked = !item.checked;
      item.updatedAt = new Date().toISOString();
      markRowDirty('grocery', id);
      renderGroceryView();
      schedulePushToGoogleSheets();
    }

    /* 2. RENDER COOK / RECIPE GALLERY & COUNTER VIEW (Local Cooking Progress + Focus Mode) */
    function getCookingProgress(recipeId, baseServings) {
      if (!uiPrefs.cookingProgress) uiPrefs.cookingProgress = {};
      if (!uiPrefs.cookingProgress[recipeId]) {
        uiPrefs.cookingProgress[recipeId] = {
          servings: Number(baseServings) || 4,
          checkedIngredients: {},
          completedSteps: {},
          activeStep: 0
        };
      }
      return uiPrefs.cookingProgress[recipeId];
    }

    function parseRecipeCategoryAndName(rawTitle) {
      const str = String(rawTitle || 'Untitled Recipe');
      const idx = str.indexOf(':');
      if (idx > 0 && idx < 18) {
        return {
          badge: str.slice(0, idx).trim(),
          cleanTitle: str.slice(idx + 1).trim()
        };
      }
      return { badge: 'Recipe', cleanTitle: str };
    }

    function matchesGalleryFilter(recipe, filterId) {
      if (!filterId || filterId === 'all') return true;
      if (filterId === 'pinned') return Boolean(recipe.active);
      const { badge } = parseRecipeCategoryAndName(recipe.title);
      const b = badge.toLowerCase();
      if (filterId === 'entree') return b.includes('entree');
      if (filterId === 'soup') return b.includes('soup') || b.includes('chili');
      if (filterId === 'side') return b.includes('salad') || b.includes('sauce');
      if (filterId === 'sweet') return b.includes('dessert') || b.includes('drink') || b.includes('how to');
      return true;
    }

    function onRecipeSearchInput(val) {
      uiPrefs.recipeSearchQuery = String(val || '');
      renderRecipeGallery();
    }

    function setRecipeCategoryFilter(catId) {
      uiPrefs.recipeCategoryFilter = catId;
      saveLocalState();
      renderRecipeGallery();
    }

    function openRecipeGallery() {
      uiPrefs.cookSubView = 'gallery';
      saveLocalState();
      renderCookView();
      window.scrollTo(0, tabScrollPositions.cook || 0);
    }

    function openRecipeDetail(recipeId) {
      if (uiPrefs.activeView === 'cook' && uiPrefs.cookSubView === 'gallery') {
        tabScrollPositions.cook = window.scrollY || 0;
      }
      uiPrefs.selectedRecipeId = recipeId;
      uiPrefs.cookSubView = 'detail';
      saveLocalState();
      renderCookView();
      window.scrollTo(0, 0);
    }

    function toggleCookFocusMode() {
      uiPrefs.cookFocusMode = !uiPrefs.cookFocusMode;
      saveLocalState();
      renderCookView();
    }

    function toggleFocusIngredientsDrawer() {
      uiPrefs.focusIngredientsOpen = !uiPrefs.focusIngredientsOpen;
      renderCookView();
    }

    function togglePinRecipe(recipeId) {
      const r = appState.recipes.find(x => x.id === recipeId);
      if (!r) return;
      r.active = !r.active;
      markRecipePinDirty(recipeId, r.active);
      renderCookView();
      schedulePushToGoogleSheets();
    }

    function renderCookView() {
      const galleryWrap = document.getElementById('recipe-gallery-view');
      const detailWrap = document.getElementById('recipe-detail-view');
      const recipes = appState.recipes || [];

      if (uiPrefs.activeView === 'cook') {
        document.getElementById('header-title').textContent =
          uiPrefs.cookSubView === 'detail' ? 'Cooking' : `Recipes (${recipes.length})`;
      }

      if (uiPrefs.cookSubView === 'detail' && recipes.length > 0) {
        galleryWrap.style.display = 'none';
        detailWrap.style.display = 'block';
        renderRecipeDetail();
      } else {
        galleryWrap.style.display = 'block';
        detailWrap.style.display = 'none';
        renderRecipeGallery();
      }
    }

    function renderRecipeGallery() {
      const pillsEl = document.getElementById('recipe-category-pills');
      const listEl = document.getElementById('recipe-gallery-list');
      const searchInput = document.getElementById('recipe-search-input');
      const recipes = appState.recipes || [];

      if (searchInput && document.activeElement !== searchInput) {
        searchInput.value = uiPrefs.recipeSearchQuery || '';
      }

      const activeFilter = uiPrefs.recipeCategoryFilter || 'all';
      pillsEl.innerHTML = GALLERY_CATEGORIES.map(c => {
        const count = recipes.filter(r => matchesGalleryFilter(r, c.id)).length;
        return `
          <button type="button" class="recipe-pill ${activeFilter === c.id ? 'active' : ''}" data-action="set-recipe-category" data-category="${escapeHtml(c.id)}">
            ${escapeHtml(c.label)} <span style="opacity:0.7; font-size:0.76rem;">(${count})</span>
          </button>
        `;
      }).join('');

      const q = (uiPrefs.recipeSearchQuery || '').trim().toLowerCase();
      const filtered = recipes
        .filter(r => matchesGalleryFilter(r, activeFilter))
        .filter(r => {
          if (!q) return true;
          const inTitle = (r.title || '').toLowerCase().includes(q);
          const inNotes = (r.notes || '').toLowerCase().includes(q);
          const inIng = (r.ingredients || []).some(i => (i.item || '').toLowerCase().includes(q));
          return inTitle || inNotes || inIng;
        })
        .sort((a, b) => Number(Boolean(b.active)) - Number(Boolean(a.active)));

      if (filtered.length === 0) {
        listEl.innerHTML = `<div class="empty-state">No matching recipes found.</div>`;
        return;
      }

      listEl.innerHTML = filtered.map(r => {
        const { badge, cleanTitle } = parseRecipeCategoryAndName(r.title);
        const prog = getCookingProgress(r.id, r.baseServings);
        const dispServings = Number(prog.servings) || Number(r.baseServings) || 4;
        return `
          <div class="gallery-card ${r.active ? 'pinned-card' : ''}" data-action="open-recipe-detail" data-recipe-id="${escapeHtml(r.id)}">
            <div class="gallery-card-top">
              <span class="category-tag">${escapeHtml(badge)}</span>
              <button type="button" class="pin-star-btn ${r.active ? 'active' : ''}" data-action="toggle-pin-recipe" data-recipe-id="${escapeHtml(r.id)}">
                ${r.active ? '★ Pinned' : '☆ Pin'}
              </button>
            </div>
            <h3 style="margin:0 0 8px 0; font-size:1.14rem; font-weight:800; line-height:1.3;">${escapeHtml(cleanTitle)}</h3>
            <div class="recipe-meta-chips" style="margin-bottom:${r.notes ? '8px' : '0'};">
              ${r.prepTime ? `<span class="meta-chip">🔪 ${escapeHtml(r.prepTime)}</span>` : ''}
              ${r.cookTime ? `<span class="meta-chip">🔥 ${escapeHtml(r.cookTime)}</span>` : ''}
              <span class="meta-chip">🍽 ${dispServings} servings</span>
            </div>
            ${r.notes ? `<div style="font-size:0.84rem; color:var(--text-secondary);">${escapeHtml(r.notes)}</div>` : ''}
          </div>
        `;
      }).join('');
    }

    function renderFocusTimerButtons(step, stepIdx) {
      const timers = extractStepTimers(step, stepIdx);
      if (timers.length === 0) return '';
      return `
        <div class="step-timer-footer">
          ${timers.map(t => `
            <button type="button" class="step-timer-big-btn" data-action="start-timer" data-seconds="${t.seconds}" data-label="${escapeHtml(t.fullLabel)}">
              ⏱ Start ${escapeHtml(t.shortDuration)}
            </button>
          `).join('')}
        </div>
      `;
    }

    function renderRecipeDetail() {
      const content = document.getElementById('recipe-content');
      const recipes = appState.recipes || [];

      if (!uiPrefs.selectedRecipeId || !recipes.some(r => r.id === uiPrefs.selectedRecipeId)) {
        const activeOne = recipes.find(r => r.active) || recipes[0];
        uiPrefs.selectedRecipeId = activeOne.id;
      }

      const recipe = recipes.find(r => r.id === uiPrefs.selectedRecipeId) || recipes[0];
      const { badge, cleanTitle } = parseRecipeCategoryAndName(recipe.title);

      const baseS = Number(recipe.baseServings) || 4;
      const prog = getCookingProgress(recipe.id, baseS);
      const currS = Number(prog.servings) || baseS;
      const isScaled = currS !== baseS;

      const prepItems = (recipe.ingredients || []).filter(i => (i.category || '').toLowerCase().includes('prep') || (i.category || '').toLowerCase().includes('mise'));
      const ingItems = (recipe.ingredients || []).filter(i => !prepItems.includes(i));
      const steps = recipe.steps || [];

      const activeStepIdx = Math.min(Math.max(0, prog.activeStep ?? 0), Math.max(0, steps.length - 1));
      const isFocus = Boolean(uiPrefs.cookFocusMode);

      const topBarHtml = `
        <div class="cook-top-nav">
          <button type="button" class="back-gallery-btn" data-action="open-recipe-gallery">
            ← Recipes
          </button>
          <button type="button" class="pin-star-btn ${isFocus ? 'active' : ''}" data-action="toggle-cook-focus-mode">
            ${isFocus ? '📋 Full View' : '🔍 Focus Step'}
          </button>
        </div>
      `;

      // FOCUSED SINGLE-STEP COUNTER MODE
      if (isFocus && steps.length > 0) {
        const currentStepObj = steps[activeStepIdx];
        const isDone = Boolean(prog.completedSteps[activeStepIdx]);
        const allIngCount = (recipe.ingredients || []).length;
        const checkedIngCount = (recipe.ingredients || []).filter(i => prog.checkedIngredients[i.id]).length;

        content.innerHTML = `
          ${topBarHtml}
          <h2 style="margin:0 0 10px 0; font-size:1.18rem; font-weight:800; line-height:1.3;">${escapeHtml(cleanTitle)}</h2>

          <div class="focus-mode-card">
            <div class="step-card-header">
              <span class="step-badge" style="background:var(--accent); color:#062117; font-size:0.86rem; padding:5px 12px;">
                Step ${activeStepIdx + 1} of ${steps.length}
              </span>
              ${isDone ? `<span style="font-size:0.84rem; font-weight:700; color:var(--accent);">✓ Done</span>` : ''}
            </div>

            <div class="focus-step-body">
              ${renderStepTextWithScalingAndTimers(currentStepObj, baseS, currS, activeStepIdx, { includeTimerChips: false })}
            </div>

            ${renderFocusTimerButtons(currentStepObj, activeStepIdx)}

            <div class="focus-nav-bar">
              <button type="button" class="btn-secondary focus-nav-btn" ${activeStepIdx === 0 ? 'disabled style="opacity:0.4;"' : ''} data-action="focus-recipe-step" data-recipe-id="${escapeHtml(recipe.id)}" data-step-idx="${Math.max(0, activeStepIdx - 1)}">
                ← Prev
              </button>
              <button type="button" class="btn-primary focus-nav-btn" style="flex:1.6;" data-action="focus-step-done-next" data-recipe-id="${escapeHtml(recipe.id)}" data-step-idx="${activeStepIdx}">
                ${activeStepIdx + 1 < steps.length ? '✓ Done · Next →' : '🎉 Finish Recipe'}
              </button>
            </div>
          </div>

          <div class="section-block">
            <div class="section-header" data-action="toggle-focus-ingredients">
              <div class="section-title-wrap">
                <span>${uiPrefs.focusIngredientsOpen ? '▾' : '▸'}</span>
                <span>Prep &amp; Ingredients</span>
              </div>
              <span class="section-count">${checkedIngCount}/${allIngCount}</span>
            </div>
            ${uiPrefs.focusIngredientsOpen ? `
              <div class="section-items">
                ${(recipe.ingredients || []).map(item => renderRecipeIngredientRow(recipe, item, baseS, currS, prog)).join('')}
              </div>
            ` : ''}
          </div>
        `;
        return;
      }

      // STANDARD FULL SCROLLABLE RECIPE MODE
      content.innerHTML = `
        ${topBarHtml}

        <div class="recipe-hero">
          <div style="margin-bottom:6px;"><span class="category-tag">${escapeHtml(badge)}</span></div>
          <h2 class="recipe-title">${escapeHtml(cleanTitle)}</h2>
          ${(recipe.prepTime || recipe.cookTime) ? `
            <div class="recipe-meta-chips">
              ${recipe.prepTime ? `<span class="meta-chip">🔪 ${escapeHtml(recipe.prepTime)}</span>` : ''}
              ${recipe.cookTime ? `<span class="meta-chip">🔥 ${escapeHtml(recipe.cookTime)}</span>` : ''}
            </div>
          ` : ''}
          ${recipe.notes ? `<div class="recipe-notes-banner">${escapeHtml(recipe.notes)}</div>` : ''}

          <div class="scaler-bar">
            <div class="scaler-label">
              <span>Servings ${isScaled ? `<span style="color:var(--accent); font-size:0.78rem;">(from ${baseS})</span>` : ''}</span>
            </div>
            <div class="scaler-controls">
              ${isScaled ? `<button type="button" class="step-done-btn" data-action="set-recipe-servings" data-recipe-id="${escapeHtml(recipe.id)}" data-servings="${baseS}">Reset</button>` : ''}
              <button type="button" class="step-btn" data-action="change-recipe-servings" data-recipe-id="${escapeHtml(recipe.id)}" data-delta="-1">−</button>
              <span class="servings-value">${currS}</span>
              <button type="button" class="step-btn" data-action="change-recipe-servings" data-recipe-id="${escapeHtml(recipe.id)}" data-delta="1">+</button>
            </div>
          </div>
        </div>

        ${prepItems.length > 0 ? `
          <div class="cook-section-title">
            <span>Mise en Place</span>
            <span style="font-size:0.76rem; color:var(--text-muted);">${prepItems.filter(i => prog.checkedIngredients[i.id]).length}/${prepItems.length}</span>
          </div>
          <div class="section-block">
            ${prepItems.map(item => renderRecipeIngredientRow(recipe, item, baseS, currS, prog)).join('')}
          </div>
        ` : ''}

        ${ingItems.length > 0 ? `
          <div class="cook-section-title">
            <span>Ingredients</span>
            <button type="button" class="step-done-btn" style="height:34px; padding:0 11px; font-size:0.76rem;" data-action="reset-recipe-checks" data-recipe-id="${escapeHtml(recipe.id)}">Reset Checks</button>
          </div>
          <div class="section-block">
            ${ingItems.map(item => renderRecipeIngredientRow(recipe, item, baseS, currS, prog)).join('')}
          </div>
        ` : ''}

        <div class="cook-section-title">
          <span>Steps</span>
          ${prepItems.length > 0 && ingItems.length === 0 ? `<button type="button" class="step-done-btn" style="height:34px; padding:0 11px; font-size:0.76rem;" data-action="reset-recipe-checks" data-recipe-id="${escapeHtml(recipe.id)}">Reset Checks</button>` : ''}
        </div>
        <div>
          ${steps.map((step, idx) => {
            const isActive = idx === activeStepIdx;
            const isDone = Boolean(prog.completedSteps[idx]);
            return `
              <div class="step-card ${isActive ? 'active-step' : ''} ${isDone ? 'completed-step' : ''}" id="recipe-step-card-${idx}" data-action="focus-recipe-step" data-recipe-id="${escapeHtml(recipe.id)}" data-step-idx="${idx}">
                <div class="step-card-header">
                  <span class="step-badge">Step ${idx + 1}</span>
                  <button type="button" class="step-check-btn ${isDone ? 'checked' : ''}" data-action="toggle-recipe-step-done" data-recipe-id="${escapeHtml(recipe.id)}" data-step-idx="${idx}" aria-label="Mark step ${idx + 1} completed">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><polyline points="20 6 9 17 4 12"></polyline></svg>
                  </button>
                </div>
                <div class="step-body">
                  ${renderStepTextWithScalingAndTimers(step, baseS, currS, idx, { includeTimerChips: true })}
                </div>
              </div>
            `;
          }).join('')}
        </div>
      `;
    }

    function renderRecipeIngredientRow(recipe, item, baseS, currS, prog) {
      const scaledQty = scaleQuantity(item.qty, baseS, currS);
      const qtyUnit = [scaledQty, item.unit].filter(Boolean).join(' ');
      const isChecked = Boolean(prog && prog.checkedIngredients && prog.checkedIngredients[item.id]);
      return `
        <div class="prep-row ${isChecked ? 'checked' : ''}" data-action="toggle-recipe-ingredient" data-recipe-id="${escapeHtml(recipe.id)}" data-ing-id="${escapeHtml(item.id)}">
          <div class="checkbox-ui">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><polyline points="20 6 9 17 4 12"></polyline></svg>
          </div>
          <div class="prep-text">
            ${qtyUnit ? `<span class="prep-qty">${escapeHtml(qtyUnit)}</span>` : ''}
            <span>${escapeHtml(item.item)}</span>
          </div>
        </div>
      `;
    }

    function changeRecipeServings(recipeId, delta) {
      const r = appState.recipes.find(x => x.id === recipeId);
      if (!r) return;
      const prog = getCookingProgress(recipeId, r.baseServings);
      prog.servings = Math.max(1, Math.min(36, (Number(prog.servings) || Number(r.baseServings) || 4) + delta));
      saveLocalState();
      renderCookView();
    }

    function setRecipeServings(recipeId, val) {
      const r = appState.recipes.find(x => x.id === recipeId);
      if (!r) return;
      const prog = getCookingProgress(recipeId, r.baseServings);
      prog.servings = Number(val) || Number(r.baseServings) || 4;
      saveLocalState();
      renderCookView();
    }

    function toggleRecipeIngredient(recipeId, ingId) {
      const r = appState.recipes.find(x => x.id === recipeId);
      if (!r) return;
      const prog = getCookingProgress(recipeId, r.baseServings);
      prog.checkedIngredients[ingId] = !prog.checkedIngredients[ingId];
      saveLocalState();
      renderCookView();
    }

    function focusRecipeStep(recipeId, idx) {
      const r = appState.recipes.find(x => x.id === recipeId);
      if (!r) return;
      const prog = getCookingProgress(recipeId, r.baseServings);
      prog.activeStep = idx;
      saveLocalState();
      renderCookView();
    }

    function toggleRecipeStepDone(recipeId, idx, forceAdvance = false) {
      const r = appState.recipes.find(x => x.id === recipeId);
      if (!r || !r.steps || !r.steps[idx]) return;
      const prog = getCookingProgress(recipeId, r.baseServings);
      if (forceAdvance) {
        prog.completedSteps[idx] = true;
      } else {
        prog.completedSteps[idx] = !prog.completedSteps[idx];
      }
      let nextIdx = null;
      if (prog.completedSteps[idx] && idx + 1 < r.steps.length) {
        prog.activeStep = idx + 1;
        nextIdx = idx + 1;
      }
      saveLocalState();
      renderCookView();

      if (nextIdx !== null && !uiPrefs.cookFocusMode) {
        requestAnimationFrame(() => {
          const nextEl = document.getElementById(`recipe-step-card-${nextIdx}`);
          if (nextEl) {
            nextEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
          }
        });
      }
    }

    function resetRecipeChecks(recipeId) {
      const r = appState.recipes.find(x => x.id === recipeId);
      if (!r) return;
      const prog = getCookingProgress(recipeId, r.baseServings);
      prog.checkedIngredients = {};
      prog.completedSteps = {};
      prog.activeStep = 0;
      saveLocalState();
      renderCookView();
    }

    /* UNDO TOAST SNACKBAR HELPER */
    let lastUndoState = null;
    let undoToastTimer = null;

    function showUndoToast(message, restoreFn) {
      lastUndoState = restoreFn;
      const toast = document.getElementById('undo-toast');
      const textEl = document.getElementById('undo-toast-text');
      if (!toast || !textEl) return;
      textEl.textContent = message;
      toast.classList.add('open');
      if (undoToastTimer) clearTimeout(undoToastTimer);
      undoToastTimer = setTimeout(() => {
        toast.classList.remove('open');
        lastUndoState = null;
      }, 5500);
    }

    function undoLastDelete() {
      if (typeof lastUndoState === 'function') {
        lastUndoState();
      }
      lastUndoState = null;
      if (undoToastTimer) clearTimeout(undoToastTimer);
      const toast = document.getElementById('undo-toast');
      if (toast) toast.classList.remove('open');
    }

    /* 3. RENDER MEAL PLAN VIEW */
    function renderMealsView() {
      const container = document.getElementById('meals-container');
      const meals = appState.meals || [];
      if (meals.length === 0) {
        container.innerHTML = `<div class="empty-state">No planned meals yet.<br/>Tap "+ Add" above or ask Gemini for meal suggestions!</div>`;
        return;
      }

      container.innerHTML = meals.map(m => {
        const hasRecipe = m.recipeId && appState.recipes.some(r => r.id === m.recipeId);
        return `
          <div class="meal-card ${hasRecipe ? 'clickable-meal' : ''}" ${hasRecipe ? `data-action="open-recipe-from-meal" data-recipe-id="${escapeHtml(m.recipeId)}"` : ''}>
            <div style="display:flex; justify-content:space-between; align-items:flex-start;">
              <span class="meal-day-tag">${escapeHtml(m.day)}</span>
              <button type="button" class="step-done-btn" data-action="delete-meal" data-id="${escapeHtml(m.id)}" aria-label="Remove meal">✕</button>
            </div>
            <h3 class="meal-title">${escapeHtml(m.name)}</h3>
            ${(m.time || m.difficulty) ? `
              <div class="recipe-meta-chips" style="margin-bottom:6px;">
                ${m.time ? `<span class="meta-chip">⏱ ${escapeHtml(m.time)}</span>` : ''}
                ${m.difficulty ? `<span class="meta-chip">📊 ${escapeHtml(m.difficulty)}</span>` : ''}
              </div>
            ` : ''}
            ${m.notes ? `<p class="meal-notes">${escapeHtml(m.notes)}</p>` : ''}
            ${hasRecipe ? `
              <div class="meal-recipe-link">
                <span>🍳 Open Recipe</span>
                <span>→</span>
              </div>
            ` : ''}
          </div>
        `;
      }).join('');
    }

    function openRecipeFromMeal(recipeId) {
      uiPrefs.selectedRecipeId = recipeId;
      uiPrefs.cookSubView = 'detail';
      tabScrollPositions.cook = 0;
      switchView('cook');
    }

    function deleteMeal(id) {
      const idx = appState.meals.findIndex(m => m.id === id);
      if (idx === -1) return;
      const removedMeal = appState.meals[idx];
      appState.meals.splice(idx, 1);
      recordDeletedId('meals', id);
      renderMealsView();
      schedulePushToGoogleSheets();

      showUndoToast(`Removed "${removedMeal.name}"`, () => {
        appState.meals.splice(idx, 0, removedMeal);
        unrecordDeletedId('meals', id);
        renderMealsView();
        schedulePushToGoogleSheets();
      });
    }

    /* 4. RENDER NOTES VIEW */
    function renderNotesView() {
      const container = document.getElementById('notes-container');
      const notes = appState.notes || [];
      if (notes.length === 0) {
        container.innerHTML = `<div class="empty-state">No notes yet. Tap "+ New" above to create a note or checklist.</div>`;
        return;
      }

      container.innerHTML = notes.map(n => {
        const items = n.items || [];
        const checkedCount = items.filter(i => i.checked).length;
        return `
          <div class="note-card">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; gap:8px;">
              <h3 style="margin:0; font-size:1.08rem; font-weight:700;">${n.pinned ? '📌 ' : ''}${escapeHtml(n.title)}</h3>
              <button type="button" class="step-done-btn" style="flex-shrink:0;" data-action="edit-note" data-id="${escapeHtml(n.id)}">Edit</button>
            </div>
            ${n.type === 'checklist' ? `
              ${items.length > 0 ? `
                <div class="section-block" style="margin-bottom:8px;">
                  ${items.map(item => `
                    <div class="grocery-row ${item.checked ? 'checked' : ''}" data-action="toggle-note-item" data-note-id="${escapeHtml(n.id)}" data-item-id="${escapeHtml(item.id)}">
                      <div class="checkbox-ui">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><polyline points="20 6 9 17 4 12"></polyline></svg>
                      </div>
                      <div class="grocery-text">${escapeHtml(item.text)}</div>
                    </div>
                  `).join('')}
                </div>
              ` : ''}
              <form style="display:flex; gap:6px;" data-action="add-note-checklist-item" data-note-id="${escapeHtml(n.id)}">
                <input type="text" class="quick-input" style="height:40px; font-size:0.88rem;" placeholder="Add item to ${escapeHtml(n.title)}…" required />
                <button type="submit" class="btn-secondary" style="flex:0 0 68px; height:40px;">Add</button>
              </form>
              ${checkedCount > 0 ? `
                <div style="margin-top:8px; display:flex; justify-content:flex-end;">
                  <button type="button" class="step-done-btn" style="height:34px; padding:0 12px; color:var(--danger);" data-action="clear-note-checked" data-note-id="${escapeHtml(n.id)}">Clear Checked (${checkedCount})</button>
                </div>
              ` : ''}
            ` : `
              <div style="white-space:pre-wrap; color:var(--text-secondary); font-size:0.95rem;">${escapeHtml(n.content)}</div>
            `}
          </div>
        `;
      }).join('');
    }

    function toggleNoteChecklistItem(noteId, itemId) {
      const note = appState.notes.find(n => n.id === noteId);
      if (!note || !note.items) return;
      const item = note.items.find(i => i.id === itemId);
      if (!item) return;
      item.checked = !item.checked;
      note.updatedAt = new Date().toISOString();
      markRowDirty('notes', noteId);
      renderNotesView();
      schedulePushToGoogleSheets();
    }

    function clearNoteCheckedItems(noteId) {
      const note = appState.notes.find(n => n.id === noteId);
      if (!note || !Array.isArray(note.items)) return;
      const checkedItems = note.items.filter(i => i.checked);
      if (checkedItems.length === 0) return;
      const prevItems = note.items.map(i => ({ ...i }));
      note.items = note.items.filter(i => !i.checked);
      note.updatedAt = new Date().toISOString();
      markRowDirty('notes', noteId);
      renderNotesView();
      schedulePushToGoogleSheets();

      showUndoToast(`Cleared ${checkedItems.length} checked item${checkedItems.length === 1 ? '' : 's'}`, () => {
        note.items = prevItems;
        note.updatedAt = new Date().toISOString();
        markRowDirty('notes', noteId);
        renderNotesView();
        schedulePushToGoogleSheets();
      });
    }

    function addNoteChecklistItem(formEl, noteId) {
      const input = formEl.querySelector('input');
      const val = input ? input.value.trim() : '';
      if (!val) return;
      const note = appState.notes.find(n => n.id === noteId);
      if (!note) return;
      note.items = note.items || [];
      note.items.push({ id: 'ci-' + Date.now() + '-' + Math.random().toString(36).slice(2, 5), text: val, checked: false });
      note.updatedAt = new Date().toISOString();
      input.value = '';
      markRowDirty('notes', noteId);
      renderNotesView();
      schedulePushToGoogleSheets();
    }

    function deleteNote(id) {
      const idx = appState.notes.findIndex(n => n.id === id);
      if (idx === -1) return;
      const removedNote = appState.notes[idx];
      appState.notes.splice(idx, 1);
      recordDeletedId('notes', id);
      renderNotesView();
      schedulePushToGoogleSheets();

      showUndoToast(`Deleted note "${removedNote.title}"`, () => {
        appState.notes.splice(idx, 0, removedNote);
        unrecordDeletedId('notes', id);
        renderNotesView();
        schedulePushToGoogleSheets();
      });
    }

    function deleteNoteFromModal() {
      const editId = document.getElementById('note-edit-id-input').value.trim();
      closeModals();
      if (editId) deleteNote(editId);
    }

    /********************************************************************
     * NAVIGATION, MODALS & DELEGATED EVENT LISTENERS
     ********************************************************************/
    const VIEW_TITLES = {
      grocery: 'Groceries',
      cook: 'Recipes',
      meals: 'Meals',
      notes: 'Notes'
    };

    let hasBooted = false;

    function switchView(viewName) {
      const prevView = uiPrefs.activeView;
      if (hasBooted && prevView && prevView !== viewName) {
        tabScrollPositions[prevView] = window.scrollY || 0;
      }

      uiPrefs.activeView = viewName;
      saveLocalState();

      if (viewName === 'cook') {
        renderCookView();
      } else {
        document.getElementById('header-title').textContent = VIEW_TITLES[viewName] || 'Pocket Kitchen';
      }

      const addBtn = document.getElementById('header-add-btn');
      if (addBtn) {
        if (viewName === 'meals') {
          addBtn.textContent = '+ Add';
          addBtn.classList.add('visible');
        } else if (viewName === 'notes') {
          addBtn.textContent = '+ New';
          addBtn.classList.add('visible');
        } else {
          addBtn.classList.remove('visible');
        }
      }

      document.querySelectorAll('.view-container').forEach(el => {
        el.classList.toggle('active', el.id === `view-${viewName}`);
      });
      document.querySelectorAll('.nav-tab').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.view === viewName);
      });

      if (hasBooted) {
        window.scrollTo(0, tabScrollPositions[viewName] || 0);
      }

      if (viewName === 'cook' && !wakeLockDesired) {
        wakeLockDesired = true;
        requestWakeLock();
      }
    }

    function renderSettingsStatusBox() {
      const cfg = getSyncConfig();
      const box = document.getElementById('settings-status-box');
      if (!box) return;
      if (cfg && cfg.webhookUrl && cfg.key) {
        const pendingSummary = getPendingSyncSummary();
        const pendingInfo = pendingSummary ? ` • Pending: ${escapeHtml(pendingSummary)}` : '';
        box.innerHTML = `✅ <strong>Connected (Sheet-Scoped Sync)</strong><br/><span style="color:var(--text-muted); font-size:0.78rem;">Last synced: ${appState.lastSyncedAt ? new Date(appState.lastSyncedAt).toLocaleTimeString() : 'Not yet'}${pendingInfo}</span>`;
      } else {
        box.innerHTML = `⚠️ <strong>Not linked yet.</strong> Open your setup link or paste the <code>#connect=...</code> code below.`;
      }
    }

    function openSettingsModal() {
      renderSettingsStatusBox();
      document.getElementById('settings-modal').classList.add('open');
    }

    function saveManualConnect() {
      const raw = document.getElementById('manual-connect-input').value.trim();
      if (!raw) return;
      const tokenPart = raw.includes('#connect=') ? raw.split('#connect=')[1].trim() : raw;
      try {
        const cfg = decodeBase64UrlJson(tokenPart);
        if (cfg && cfg.webhookUrl && cfg.key) {
          saveSyncConfig(cfg);
          document.getElementById('manual-connect-input').value = '';
          closeModals();
          pullFromGoogleSheets();
        } else {
          alert('Invalid connection link or code.');
        }
      } catch (e) {
        alert('Invalid connection link or code.');
      }
    }

    function openAddMealModal() {
      const sel = document.getElementById('meal-recipe-select');
      if (sel) {
        const recipes = [...(appState.recipes || [])].sort((a, b) => (a.title || '').localeCompare(b.title || ''));
        sel.innerHTML = `<option value="">— Custom / Unlinked Meal —</option>` +
          recipes.map(r => `<option value="${escapeHtml(r.id)}">${escapeHtml(r.title)}</option>`).join('');
      }
      document.getElementById('add-meal-modal').classList.add('open');
    }

    function openAddNoteModal() {
      document.getElementById('note-modal-title').textContent = 'New Note';
      document.getElementById('note-edit-id-input').value = '';
      document.getElementById('note-type-group').style.display = 'block';
      document.getElementById('delete-note-modal-btn').style.display = 'none';
      document.getElementById('add-note-form').reset();
      document.getElementById('note-content-label').textContent = 'Checklist Items (one per line)';
      document.getElementById('add-note-modal').classList.add('open');
    }

    function openEditNoteModal(noteId) {
      const note = appState.notes.find(n => n.id === noteId);
      if (!note) return;
      document.getElementById('note-modal-title').textContent = 'Edit Note';
      document.getElementById('note-edit-id-input').value = note.id;
      document.getElementById('note-title-input').value = note.title || '';
      document.getElementById('note-type-input').value = note.type || 'text';
      document.getElementById('note-type-group').style.display = 'none';
      document.getElementById('delete-note-modal-btn').style.display = 'inline-flex';
      document.getElementById('note-content-label').textContent =
        note.type === 'checklist' ? 'Checklist Items (one per line)' : 'Content';
      document.getElementById('note-content-input').value =
        note.type === 'checklist'
          ? (note.items || []).map(i => i.text).join('\n')
          : (note.content || '');
      document.getElementById('add-note-modal').classList.add('open');
    }

    function closeModals() {
      document.querySelectorAll('.modal-backdrop').forEach(m => m.classList.remove('open'));
    }

    function applyTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme);
      localStorage.setItem(STORAGE_KEYS.THEME, theme);
      document.getElementById('meta-theme-color').setAttribute('content', theme === 'dark' ? '#0d1210' : '#ffffff');
      const themeBtn = document.getElementById('theme-btn');
      if (themeBtn) {
        themeBtn.textContent = theme === 'dark' ? '◐ Dark Mode (Tap for Light)' : '☀ Light Mode (Tap for Dark)';
      }
    }

    // Unified Delegated Click Listener (Immune to quotes, inch marks, and apostrophes)
    document.addEventListener('click', (e) => {
      if (e.target.classList && e.target.classList.contains('modal-backdrop')) {
        closeModals();
        return;
      }

      const actionEl = e.target.closest('[data-action]');
      if (!actionEl) return;

      const action = actionEl.dataset.action;
      switch (action) {
        case 'header-contextual-add':
          if (uiPrefs.activeView === 'meals') openAddMealModal();
          else if (uiPrefs.activeView === 'notes') openAddNoteModal();
          break;
        case 'sync-now':
          syncWithGoogleSheets().then(() => {
            if (document.getElementById('settings-modal').classList.contains('open')) {
              renderSettingsStatusBox();
            }
          });
          break;
        case 'open-settings-modal':
          openSettingsModal();
          break;
        case 'open-add-meal-modal':
          openAddMealModal();
          break;
        case 'open-add-note-modal':
          openAddNoteModal();
          break;
        case 'close-modals':
          closeModals();
          break;
        case 'save-manual-connect':
          saveManualConnect();
          break;
        case 'test-timer-alert':
          testTimerChimeAndBuzz();
          break;
        case 'undo-last-delete':
          undoLastDelete();
          break;
        case 'start-timer':
          e.stopPropagation();
          startKitchenTimer(Number(actionEl.dataset.seconds) || 60, actionEl.dataset.label || 'Kitchen Timer');
          break;
        case 'toggle-timer-expand':
          toggleTimerExpand(actionEl.dataset.id);
          break;
        case 'add-timer-minute':
          e.stopPropagation();
          addMinuteToTimer(actionEl.dataset.id);
          break;
        case 'toggle-timer-pause':
          e.stopPropagation();
          toggleTimerPause(actionEl.dataset.id);
          break;
        case 'dismiss-timer':
          e.stopPropagation();
          dismissTimer(actionEl.dataset.id);
          break;
        case 'toggle-grocery-section':
          toggleGrocerySection(actionEl.dataset.section);
          break;
        case 'toggle-grocery-item':
          toggleGroceryItem(actionEl.dataset.id);
          break;
        case 'set-recipe-category':
          setRecipeCategoryFilter(actionEl.dataset.category);
          break;
        case 'open-recipe-gallery':
          openRecipeGallery();
          break;
        case 'open-recipe-detail':
          openRecipeDetail(actionEl.dataset.recipeId);
          break;
        case 'toggle-pin-recipe':
          e.stopPropagation();
          togglePinRecipe(actionEl.dataset.recipeId);
          break;
        case 'toggle-cook-focus-mode':
          toggleCookFocusMode();
          break;
        case 'toggle-focus-ingredients':
          toggleFocusIngredientsDrawer();
          break;
        case 'focus-step-done-next':
          toggleRecipeStepDone(actionEl.dataset.recipeId, Number(actionEl.dataset.stepIdx), true);
          break;
        case 'set-recipe-servings':
          setRecipeServings(actionEl.dataset.recipeId, Number(actionEl.dataset.servings));
          break;
        case 'change-recipe-servings':
          changeRecipeServings(actionEl.dataset.recipeId, Number(actionEl.dataset.delta));
          break;
        case 'toggle-recipe-ingredient':
          toggleRecipeIngredient(actionEl.dataset.recipeId, actionEl.dataset.ingId);
          break;
        case 'reset-recipe-checks':
          resetRecipeChecks(actionEl.dataset.recipeId);
          break;
        case 'focus-recipe-step':
          focusRecipeStep(actionEl.dataset.recipeId, Number(actionEl.dataset.stepIdx));
          break;
        case 'toggle-recipe-step-done':
          e.stopPropagation();
          toggleRecipeStepDone(actionEl.dataset.recipeId, Number(actionEl.dataset.stepIdx));
          break;
        case 'open-recipe-from-meal':
          openRecipeFromMeal(actionEl.dataset.recipeId);
          break;
        case 'delete-meal':
          e.stopPropagation();
          deleteMeal(actionEl.dataset.id);
          break;
        case 'toggle-note-item':
          toggleNoteChecklistItem(actionEl.dataset.noteId, actionEl.dataset.itemId);
          break;
        case 'clear-note-checked':
          clearNoteCheckedItems(actionEl.dataset.noteId);
          break;
        case 'edit-note':
          openEditNoteModal(actionEl.dataset.id);
          break;
        case 'delete-note':
          deleteNote(actionEl.dataset.id);
          break;
        case 'delete-note-from-modal':
          deleteNoteFromModal();
          break;
      }
    });

    // Delegated Form Submit Listener for Note Checklists
    document.addEventListener('submit', (e) => {
      const formEl = e.target.closest('form[data-action="add-note-checklist-item"]');
      if (formEl) {
        e.preventDefault();
        addNoteChecklistItem(formEl, formEl.dataset.noteId);
      }
    });

    // Recipe Search Input Listener
    document.getElementById('recipe-search-input').addEventListener('input', (e) => {
      onRecipeSearchInput(e.target.value);
    });

    // Note Type Selector Label Toggle
    document.getElementById('note-type-input').addEventListener('change', (e) => {
      document.getElementById('note-content-label').textContent =
        e.target.value === 'checklist' ? 'Checklist Items (one per line)' : 'Content';
    });

    // Smart Aisle Auto-Selection on Grocery Quick Add
    let grocerySectionManuallyChosen = false;
    document.getElementById('grocery-section-select').addEventListener('change', () => {
      grocerySectionManuallyChosen = true;
    });
    document.getElementById('grocery-input').addEventListener('input', (e) => {
      const val = e.target.value;
      if (!val.trim()) {
        grocerySectionManuallyChosen = false;
        return;
      }
      if (!grocerySectionManuallyChosen) {
        const inferred = inferGrocerySection(val);
        if (inferred) {
          document.getElementById('grocery-section-select').value = inferred;
        }
      }
    });

    // Auto-fill Meal Name & Time when selecting a Recipe from the gallery dropdown
    document.getElementById('meal-recipe-select').addEventListener('change', (e) => {
      const recId = e.target.value;
      if (!recId) return;
      const r = (appState.recipes || []).find(x => x.id === recId);
      if (!r) return;
      const nameInput = document.getElementById('meal-name-input');
      const timeInput = document.getElementById('meal-time-input');
      if (nameInput && !nameInput.value.trim()) {
        nameInput.value = parseRecipeCategoryAndName(r.title).cleanTitle || r.title || '';
      }
      if (timeInput && !timeInput.value.trim()) {
        timeInput.value = [r.prepTime, r.cookTime].filter(Boolean).join(' + ') || r.cookTime || r.prepTime || '';
      }
    });

    // Wire up Bottom Nav & Top Bar UI events
    document.querySelectorAll('.nav-tab').forEach(btn => {
      btn.addEventListener('click', () => {
        if (btn.dataset.view === 'cook' && uiPrefs.activeView === 'cook' && uiPrefs.cookSubView === 'detail') {
          openRecipeGallery();
          return;
        }
        switchView(btn.dataset.view);
      });
    });

    document.getElementById('wake-btn').addEventListener('click', toggleWakeLock);
    document.getElementById('sync-pill').addEventListener('click', () => {
      if (!getSyncConfig()) openSettingsModal();
      else pullFromGoogleSheets();
    });
    document.getElementById('settings-btn').addEventListener('click', openSettingsModal);
    document.getElementById('theme-btn').addEventListener('click', () => {
      const current = document.documentElement.getAttribute('data-theme') || 'dark';
      applyTheme(current === 'dark' ? 'light' : 'dark');
    });

    document.getElementById('grocery-add-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const input = document.getElementById('grocery-input');
      const secSelect = document.getElementById('grocery-section-select');
      const text = input.value.trim();
      if (!text) return;
      const chosenSection = grocerySectionManuallyChosen
        ? secSelect.value
        : (inferGrocerySection(text) || secSelect.value);

      if (grocerySectionManuallyChosen) {
        const normKey = normalizeGroceryItemKey(text);
        if (normKey) {
          if (!uiPrefs.learnedAisles) uiPrefs.learnedAisles = {};
          uiPrefs.learnedAisles[normKey] = chosenSection;
        }
      }

      const newId = 'g-' + Date.now() + '-' + Math.random().toString(36).slice(2, 5);
      appState.grocery.push({
        id: newId,
        section: chosenSection,
        item: text,
        checked: false,
        sortOrder: appState.grocery.length + 1,
        updatedAt: new Date().toISOString()
      });
      input.value = '';
      grocerySectionManuallyChosen = false;
      markRowDirty('grocery', newId);
      renderGroceryView();
      schedulePushToGoogleSheets();
    });

    document.getElementById('toggle-hide-checked-btn').addEventListener('click', () => {
      uiPrefs.hideCheckedGrocery = !uiPrefs.hideCheckedGrocery;
      saveLocalState();
      renderGroceryView();
    });

    document.getElementById('clear-checked-btn').addEventListener('click', () => {
      const checkedItems = appState.grocery.filter(i => i.checked);
      if (checkedItems.length === 0) return;
      const snapshot = checkedItems.map(i => ({ ...i }));
      appState.grocery = appState.grocery.filter(i => !i.checked);
      checkedItems.forEach(i => recordDeletedId('grocery', i.id));
      renderGroceryView();
      schedulePushToGoogleSheets();

      showUndoToast(`Cleared ${snapshot.length} checked item${snapshot.length === 1 ? '' : 's'}`, () => {
        appState.grocery.push(...snapshot);
        snapshot.forEach(i => unrecordDeletedId('grocery', i.id));
        renderGroceryView();
        schedulePushToGoogleSheets();
      });
    });

    document.getElementById('add-meal-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const linkedRecipeId = document.getElementById('meal-recipe-select').value || '';
      const newId = 'm-' + Date.now() + '-' + Math.random().toString(36).slice(2, 5);
      appState.meals.push({
        id: newId,
        day: document.getElementById('meal-day-input').value.trim(),
        name: document.getElementById('meal-name-input').value.trim(),
        time: document.getElementById('meal-time-input').value.trim(),
        difficulty: '',
        notes: document.getElementById('meal-notes-input').value.trim(),
        recipeId: linkedRecipeId
      });
      markRowDirty('meals', newId);
      e.target.reset();
      closeModals();
      renderMealsView();
      schedulePushToGoogleSheets();
    });

    document.getElementById('add-note-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const editId = document.getElementById('note-edit-id-input').value.trim();
      const title = document.getElementById('note-title-input').value.trim();
      const type = document.getElementById('note-type-input').value;
      const content = document.getElementById('note-content-input').value.trim();

      if (editId) {
        const existing = appState.notes.find(n => n.id === editId);
        if (existing) {
          existing.title = title;
          if (existing.type === 'checklist') {
            const oldPool = [...(existing.items || [])];
            const lines = content.split('\n').map(s => s.trim()).filter(Boolean);
            existing.items = lines.map((lineText, idx) => {
              const matchIdx = oldPool.findIndex(old => (old.text || '').toLowerCase() === lineText.toLowerCase());
              if (matchIdx !== -1) {
                const matched = oldPool.splice(matchIdx, 1)[0];
                return { id: matched.id, text: lineText, checked: Boolean(matched.checked) };
              }
              return { id: `ci-${Date.now()}-${idx}`, text: lineText, checked: false };
            });
            existing.content = '';
          } else {
            existing.content = content;
          }
          existing.updatedAt = new Date().toISOString();
          markRowDirty('notes', existing.id);
        }
      } else {
        const newId = 'n-' + Date.now() + '-' + Math.random().toString(36).slice(2, 5);
        const items = type === 'checklist'
          ? content.split('\n').map(s => s.trim()).filter(Boolean).map((t, i) => ({ id: `ci-${Date.now()}-${i}`, text: t, checked: false }))
          : [];
        appState.notes.unshift({
          id: newId,
          title,
          type,
          content: type === 'checklist' ? '' : content,
          items,
          pinned: false,
          updatedAt: new Date().toISOString()
        });
        markRowDirty('notes', newId);
      }
      e.target.reset();
      document.getElementById('note-edit-id-input').value = '';
      closeModals();
      renderNotesView();
      schedulePushToGoogleSheets();
    });

    // Boot Application
    (function init() {
      const savedTheme = localStorage.getItem(STORAGE_KEYS.THEME) ||
        (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
      applyTheme(savedTheme);
      loadLocalState();
      // Always start fresh on search query on full app boot so gallery isn't unexpectedly empty
      uiPrefs.recipeSearchQuery = '';
      loadTimersFromStorage();
      checkUrlHashForConnection();
      switchView(uiPrefs.activeView || 'grocery');
      hasBooted = true;
      renderAll();
      pullFromGoogleSheets();

      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible') {
          pullFromGoogleSheets({ silent: true });
        }
      });

      window.addEventListener('hashchange', () => {
        if (checkUrlHashForConnection()) {
          pullFromGoogleSheets();
        }
      });

      window.addEventListener('online', () => {
        pullFromGoogleSheets({ silent: true });
      });

      // Background poll every 60 seconds while app is open (especially when Awake Lock is active)
      setInterval(() => {
        if (document.visibilityState === 'visible') {
          pullFromGoogleSheets({ silent: true });
        }
      }, 60000);

      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./sw.js').then(reg => {
          reg.update();
        }).catch(() => {});
      }
    })();
  </script>
</body>
</html>
