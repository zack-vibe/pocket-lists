<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0f1412" id="meta-theme-color" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://script.google.com https://script.googleusercontent.com; object-src 'none'; base-uri 'self'; form-action 'self';" />
  <title>Pocket Kitchen &amp; Lists</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/svg+xml" href="icon.svg" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <style>
    :root, [data-theme="dark"] {
      --bg-primary: #0d1210;
      --bg-elevated: #161f1b;
      --bg-card: #1b2621;
      --bg-card-hover: #223029;
      --bg-input: #121916;
      --border-subtle: #283830;
      --border-focus: #34d399;
      --text-primary: #f1f5f3;
      --text-secondary: #a3b8ae;
      --text-muted: #687d73;
      --accent: #34d399;
      --accent-strong: #10b981;
      --accent-soft: rgba(52, 211, 153, 0.14);
      --accent-border: rgba(52, 211, 153, 0.38);
      --warn: #fbbf24;
      --warn-soft: rgba(251, 191, 36, 0.15);
      --danger: #f87171;
      --danger-soft: rgba(248, 113, 113, 0.14);
      --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.28);
      --shadow-lg: 0 8px 26px rgba(0, 0, 0, 0.48);
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --timer-dock-offset: 0px;
      --radius-sm: 10px;
      --radius-md: 16px;
      --radius-lg: 22px;
    }

    [data-theme="light"] {
      --bg-primary: #f4f7f5;
      --bg-elevated: #ffffff;
      --bg-card: #ffffff;
      --bg-card-hover: #edf3ef;
      --bg-input: #eaf0ec;
      --border-subtle: #d5e0d9;
      --border-focus: #059669;
      --text-primary: #111c16;
      --text-secondary: #43594e;
      --text-muted: #728a7e;
      --accent: #059669;
      --accent-strong: #047857;
      --accent-soft: rgba(5, 150, 105, 0.11);
      --accent-border: rgba(5, 150, 105, 0.35);
      --warn: #d97706;
      --warn-soft: rgba(217, 119, 6, 0.12);
      --danger: #dc2626;
      --danger-soft: rgba(220, 38, 38, 0.1);
      --shadow-sm: 0 2px 8px rgba(15, 28, 21, 0.06);
      --shadow-lg: 0 8px 24px rgba(15, 28, 21, 0.12);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    button, .grocery-row, .prep-row, .section-header, .gallery-card, .step-card, .sync-pill, .nav-tab {
      touch-action: manipulation;
    }

    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg-primary);
      color: var(--text-primary);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Google Sans", Inter, sans-serif;
      font-size: 16px;
      line-height: 1.45;
      overscroll-behavior-y: contain;
      min-height: 100dvh;
    }

    /* App Layout */
    .app-shell {
      max-width: 540px;
      margin: 0 auto;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      padding-top: calc(var(--safe-top) + 64px);
      padding-bottom: calc(var(--safe-bottom) + 96px + var(--timer-dock-offset));
      transition: padding-bottom 0.18s ease;
    }

    /* Top Header */
    .top-bar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 40;
      background: var(--bg-elevated);
      border-bottom: 1px solid var(--border-subtle);
      padding-top: var(--safe-top);
      box-shadow: var(--shadow-sm);
    }

    .top-bar-inner {
      max-width: 540px;
      margin: 0 auto;
      height: 64px;
      padding: 0 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      flex: 1;
    }

    .brand-title {
      font-size: 1.06rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .sync-pill {
      display: none;
      align-items: center;
      gap: 5px;
      font-size: 0.73rem;
      font-weight: 600;
      padding: 4px 9px;
      border-radius: 999px;
      background: var(--bg-input);
      color: var(--text-secondary);
      border: 1px solid var(--border-subtle);
      cursor: pointer;
      user-select: none;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .sync-pill.syncing,
    .sync-pill.error,
    .sync-pill.unlinked {
      display: inline-flex;
    }

    .sync-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--text-muted);
    }
    .sync-pill.synced .sync-dot { background: var(--accent); }
    .sync-pill.syncing .sync-dot { background: var(--warn); animation: pulse 1s infinite; }
    .sync-pill.error .sync-dot { background: var(--danger); }
    .sync-pill.unlinked .sync-dot { background: var(--text-muted); }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.35; }
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .header-add-btn {
      height: 38px;
      padding: 0 13px;
      border-radius: 999px;
      border: none;
      background: var(--accent);
      color: #062117;
      font-size: 0.82rem;
      font-weight: 800;
      cursor: pointer;
      display: none;
      align-items: center;
      gap: 4px;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .header-add-btn.visible {
      display: inline-flex;
    }

    .icon-btn, .wake-btn {
      width: 40px;
      height: 40px;
      border-radius: 999px;
      border: 1px solid var(--border-subtle);
      background: var(--bg-card);
      color: var(--text-secondary);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      font-size: 1.05rem;
      cursor: pointer;
      flex-shrink: 0;
      transition: all 0.15s ease;
    }

    .wake-btn svg {
      width: 19px;
      height: 19px;
      stroke-width: 2.1;
    }

    .wake-btn.active {
      background: var(--accent-soft);
      color: var(--accent);
      border-color: var(--accent-border);
    }

    /* Main Content Container */
    .view-container {
      flex: 1;
      padding: 14px 14px 28px;
      display: none;
      animation: fadeIn 0.16s ease;
    }

    .view-container.active {
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Grocery View */
    .progress-card {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 12px 14px;
      margin-bottom: 12px;
      box-shadow: var(--shadow-sm);
    }

    .progress-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-secondary);
      margin-bottom: 8px;
    }

    .progress-track {
      height: 8px;
      background: var(--bg-input);
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent-strong), var(--accent));
      width: 0%;
      transition: width 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .quick-add-bar {
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
    }

    .quick-input {
      flex: 1;
      min-width: 0;
      height: 46px;
      padding: 0 14px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border-subtle);
      background: var(--bg-input);
      color: var(--text-primary);
      font-size: 0.96rem;
      outline: none;
    }

    .quick-input:focus {
      border-color: var(--border-focus);
    }

    .quick-select {
      width: 118px;
      height: 46px;
      padding: 0 8px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border-subtle);
      background: var(--bg-card);
      color: var(--text-secondary);
      font-size: 0.82rem;
      font-weight: 600;
    }

    .btn-primary {
      height: 46px;
      padding: 0 16px;
      border-radius: var(--radius-md);
      border: none;
      background: var(--accent);
      color: #062117;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      white-space: nowrap;
    }

    .section-block {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      margin-bottom: 12px;
      overflow: hidden;
      box-shadow: var(--shadow-sm);
    }

    .section-header {
      padding: 12px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      user-select: none;
      background: rgba(255, 255, 255, 0.02);
      border-bottom: 1px solid var(--border-subtle);
    }

    .section-block.collapsed .section-header {
      border-bottom: none;
    }

    .section-block.collapsed .section-items {
      display: none;
    }

    .section-title-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      font-size: 0.92rem;
      letter-spacing: 0.02em;
      text-transform: uppercase;
      color: var(--accent);
    }

    .section-count {
      font-size: 0.76rem;
      font-weight: 600;
      color: var(--text-secondary);
      background: var(--bg-input);
      padding: 2px 8px;
      border-radius: 999px;
    }

    /* Uncluttered Grocery Item Row */
    .grocery-row {
      display: flex;
      align-items: center;
      gap: 13px;
      min-height: 52px;
      padding: 10px 14px;
      border-bottom: 1px solid var(--border-subtle);
      cursor: pointer;
      user-select: none;
      transition: background 0.12s ease, opacity 0.15s ease;
    }

    .grocery-row:last-child {
      border-bottom: none;
    }

    .grocery-row:active {
      background: var(--bg-card-hover);
    }

    .checkbox-ui {
      width: 24px;
      height: 24px;
      border-radius: 7px;
      border: 2px solid var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: all 0.14s ease;
      background: transparent;
    }

    .grocery-row.checked .checkbox-ui,
    .prep-row.checked .checkbox-ui {
      background: var(--accent);
      border-color: var(--accent);
      color: #062117;
    }

    .checkbox-ui svg {
      width: 15px;
      height: 15px;
      stroke-width: 3;
      opacity: 0;
      transform: scale(0.7);
      transition: all 0.14s ease;
    }

    .grocery-row.checked .checkbox-ui svg,
    .prep-row.checked .checkbox-ui svg {
      opacity: 1;
      transform: scale(1);
    }

    .grocery-text {
      flex: 1;
      font-size: 1.04rem;
      font-weight: 500;
      color: var(--text-primary);
      transition: color 0.14s ease;
    }

    .grocery-row.checked {
      opacity: 0.52;
    }

    .grocery-row.checked .grocery-text {
      text-decoration: line-through;
      color: var(--text-muted);
    }

    .list-footer-bar {
      display: flex;
      gap: 10px;
      margin-top: 14px;
    }

    .btn-secondary {
      flex: 1;
      height: 44px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border-subtle);
      background: var(--bg-card);
      color: var(--text-secondary);
      font-weight: 600;
      font-size: 0.88rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .btn-secondary.danger {
      color: var(--danger);
      border-color: rgba(248, 113, 113, 0.28);
    }

    /* Cook / Recipe Gallery & Counter View */
    .recipe-switcher {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 8px;
      margin-bottom: 12px;
      scrollbar-width: none;
    }
    .recipe-switcher::-webkit-scrollbar { display: none; }

    .recipe-pill {
      padding: 8px 14px;
      border-radius: 999px;
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      color: var(--text-secondary);
      font-size: 0.84rem;
      font-weight: 700;
      white-space: nowrap;
      cursor: pointer;
      transition: all 0.14s ease;
    }

    .recipe-pill.active {
      background: var(--accent-soft);
      border-color: var(--accent);
      color: var(--accent);
    }

    .gallery-card {
      background: var(--bg-card);
      border: 1.5px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 15px 16px;
      margin-bottom: 11px;
      cursor: pointer;
      transition: all 0.15s ease;
      box-shadow: var(--shadow-sm);
    }

    .gallery-card:active {
      transform: scale(0.99);
      background: var(--bg-card-hover);
    }

    .gallery-card.pinned-card {
      border-color: var(--accent-border);
      background: linear-gradient(180deg, var(--accent-soft) 0%, var(--bg-card) 100%);
    }

    .gallery-card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 6px;
    }

    .category-tag {
      font-size: 0.72rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 3px 9px;
      border-radius: 999px;
      background: var(--bg-input);
      color: var(--accent);
      border: 1px solid var(--border-subtle);
    }

    .pin-star-btn {
      height: 38px;
      padding: 0 12px;
      border-radius: 999px;
      border: 1px solid var(--border-subtle);
      background: var(--bg-input);
      color: var(--text-secondary);
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .pin-star-btn.active {
      background: var(--accent-soft);
      color: var(--accent);
      border-color: var(--accent-border);
    }

    .cook-top-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }

    .back-gallery-btn {
      height: 40px;
      padding: 0 14px;
      border-radius: 999px;
      border: 1px solid var(--border-subtle);
      background: var(--bg-card);
      color: var(--text-primary);
      font-size: 0.86rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      box-shadow: var(--shadow-sm);
    }

    .recipe-hero {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: 18px 16px;
      margin-bottom: 14px;
      box-shadow: var(--shadow-sm);
    }

    .recipe-title {
      font-size: 1.38rem;
      font-weight: 800;
      line-height: 1.25;
      margin: 0 0 10px 0;
      letter-spacing: -0.02em;
    }

    .recipe-meta-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-bottom: 12px;
    }

    .meta-chip {
      font-size: 0.8rem;
      font-weight: 600;
      padding: 5px 10px;
      border-radius: 8px;
      background: var(--bg-input);
      color: var(--text-secondary);
      border: 1px solid var(--border-subtle);
    }

    .recipe-notes-banner {
      font-size: 0.88rem;
      color: var(--text-secondary);
      background: var(--accent-soft);
      border-left: 3px solid var(--accent);
      padding: 9px 12px;
      border-radius: 6px;
      margin-bottom: 14px;
    }

    /* Dynamic Serving Scaler */
    .scaler-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--bg-input);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 10px 12px;
      gap: 10px;
    }

    .scaler-label {
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--text-primary);
      display: flex;
      flex-direction: column;
    }

    .scaler-sub {
      font-size: 0.74rem;
      font-weight: 500;
      color: var(--text-muted);
    }

    .scaler-controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .step-btn {
      width: 42px;
      height: 42px;
      border-radius: 11px;
      border: 1px solid var(--border-subtle);
      background: var(--bg-card);
      color: var(--text-primary);
      font-size: 1.25rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .step-btn:active {
      background: var(--accent);
      color: #062117;
    }

    .servings-value {
      min-width: 38px;
      text-align: center;
      font-size: 1.2rem;
      font-weight: 800;
      color: var(--accent);
    }

    /* Cook Mode Sub-tabs or Sections */
    .cook-section-title {
      font-size: 0.95rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--text-secondary);
      margin: 18px 0 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .prep-row {
      display: flex;
      align-items: center;
      gap: 13px;
      min-height: 52px;
      padding: 10px 14px;
      border-bottom: 1px solid var(--border-subtle);
      cursor: pointer;
      user-select: none;
    }

    .prep-row:last-child { border-bottom: none; }
    .prep-row.checked { opacity: 0.48; }
    .prep-row.checked .prep-text { text-decoration: line-through; }

    .prep-qty {
      font-weight: 800;
      color: var(--accent);
      margin-right: 4px;
    }

    /* Interactive Step-by-Step Cards */
    .step-card {
      background: var(--bg-card);
      border: 2px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: 16px;
      margin-bottom: 12px;
      transition: all 0.18s ease;
      cursor: pointer;
      position: relative;
      box-shadow: var(--shadow-sm);
    }

    .step-card.active-step {
      border-color: var(--accent);
      background: var(--bg-card-hover);
      box-shadow: 0 0 0 3px var(--accent-soft), var(--shadow-lg);
    }

    .step-card.completed-step {
      opacity: 0.5;
    }

    .step-card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
      gap: 8px;
    }

    .step-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.82rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      padding: 5px 11px;
      border-radius: 999px;
      background: var(--bg-input);
      color: var(--text-secondary);
    }

    .step-card.active-step .step-badge {
      background: var(--accent);
      color: #062117;
    }

    .step-done-btn {
      height: 40px;
      padding: 0 14px;
      border-radius: 999px;
      border: 1px solid var(--border-subtle);
      background: var(--bg-input);
      color: var(--text-secondary);
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      white-space: nowrap;
    }

    .step-check-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 2px solid var(--text-muted);
      background: var(--bg-input);
      color: transparent;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      padding: 0;
      transition: all 0.14s ease;
    }

    .step-check-btn svg {
      width: 18px;
      height: 18px;
      stroke-width: 3;
      opacity: 0;
      transform: scale(0.75);
      transition: all 0.14s ease;
    }

    .step-check-btn.checked {
      background: var(--accent);
      border-color: var(--accent);
      color: #062117;
    }

    .step-check-btn.checked svg {
      opacity: 1;
      transform: scale(1);
    }

    .step-body {
      font-size: 1.12rem;
      line-height: 1.58;
      color: var(--text-primary);
    }

    .inline-qty {
      display: inline-block;
      background: var(--accent-soft);
      color: var(--accent);
      border: 1px solid var(--accent-border);
      font-weight: 700;
      padding: 1px 7px;
      border-radius: 6px;
      margin: 0 1px;
    }

    .timer-chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: var(--warn-soft);
      color: var(--warn);
      border: 1px solid rgba(251, 191, 36, 0.45);
      font-weight: 700;
      font-size: 0.94rem;
      min-height: 40px;
      padding: 6px 13px;
      border-radius: 999px;
      margin: 3px 2px;
      cursor: pointer;
      vertical-align: middle;
    }

    .timer-chip:active {
      transform: scale(0.96);
    }

    .step-timer-footer {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
    }

    .step-timer-big-btn {
      min-height: 46px;
      padding: 8px 16px;
      border-radius: 12px;
      background: var(--warn-soft);
      color: var(--warn);
      border: 1.5px solid rgba(251, 191, 36, 0.45);
      font-weight: 800;
      font-size: 0.94rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      flex: 1 1 auto;
      justify-content: center;
    }

    /* Counter Focus Mode (Single-Step Large View) */
    .focus-mode-card {
      background: var(--bg-card);
      border: 2.5px solid var(--accent);
      border-radius: var(--radius-lg);
      padding: 20px 18px;
      margin-bottom: 14px;
      box-shadow: var(--shadow-lg);
    }

    .focus-step-body {
      font-size: 1.32rem;
      line-height: 1.62;
      color: var(--text-primary);
      margin: 14px 0 16px;
    }

    .focus-nav-bar {
      display: flex;
      gap: 10px;
      margin-top: 14px;
    }

    .focus-nav-btn {
      flex: 1;
      height: 48px;
      border-radius: var(--radius-md);
      font-size: 0.96rem;
      font-weight: 800;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    /* Floating Kitchen Timer Dock — Slim expandable pill while running, prominent when done */
    .timer-dock {
      position: fixed;
      left: 12px;
      right: 12px;
      bottom: calc(var(--safe-bottom) + 74px);
      max-width: 516px;
      margin: 0 auto;
      z-index: 45;
      display: flex;
      flex-direction: column;
      gap: 6px;
      pointer-events: none;
    }

    .timer-bar {
      pointer-events: auto;
      background: #15211c;
      color: #f1f5f3;
      border: 1.5px solid rgba(251, 191, 36, 0.52);
      border-radius: 14px;
      padding: 8px 13px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.65);
      opacity: 1 !important;
      cursor: pointer;
    }

    .timer-bar-main {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      min-width: 0;
      width: 100%;
    }

    .timer-bar-controls {
      display: flex;
      gap: 6px;
      justify-content: flex-end;
      padding-top: 6px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
    }

    [data-theme="light"] .timer-bar-controls {
      border-top-color: rgba(15, 28, 21, 0.1);
    }

    [data-theme="light"] .timer-bar {
      background: #ffffff;
      color: #111c16;
      box-shadow: 0 8px 24px rgba(15, 28, 21, 0.22);
    }

    @keyframes timerBorderFlash {
      0%, 100% {
        border-color: #34d399;
        box-shadow: 0 0 0 4px rgba(52, 211, 153, 0.38), 0 12px 32px rgba(0, 0, 0, 0.75);
      }
      50% {
        border-color: #fbbf24;
        box-shadow: 0 0 0 6px rgba(251, 191, 36, 0.48), 0 12px 32px rgba(0, 0, 0, 0.75);
      }
    }

    .timer-bar.finished {
      background: #10261d;
      padding: 11px 14px;
      border-width: 3.5px;
      border-color: var(--accent);
      opacity: 1 !important;
      cursor: default;
      animation: timerBorderFlash 1.15s ease-in-out infinite;
    }

    [data-theme="light"] .timer-bar.finished {
      background: #ecfdf5;
      color: #064e3b;
    }

    .timer-countdown {
      font-size: 1.08rem;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      color: var(--warn);
      flex-shrink: 0;
    }

    .timer-bar.finished .timer-countdown {
      color: var(--accent);
    }

    /* Undo Snackbar Toast */
    .undo-toast {
      position: fixed;
      left: 16px;
      right: 16px;
      bottom: calc(var(--safe-bottom) + 78px + var(--timer-dock-offset));
      max-width: 480px;
      margin: 0 auto;
      background: #1a2822;
      color: #f1f5f3;
      border: 1.5px solid var(--accent-border);
      border-radius: 14px;
      padding: 10px 14px;
      display: none;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      z-index: 55;
      box-shadow: var(--shadow-lg);
      font-size: 0.9rem;
      font-weight: 600;
    }

    [data-theme="light"] .undo-toast {
      background: #111c16;
      color: #f4f7f5;
    }

    .undo-toast.open {
      display: flex;
      animation: fadeIn 0.16s ease;
    }

    .undo-btn {
      height: 36px;
      padding: 0 14px;
      border-radius: 999px;
      border: none;
      background: var(--accent);
      color: #062117;
      font-weight: 800;
      font-size: 0.84rem;
      cursor: pointer;
      flex-shrink: 0;
    }

    /* Meal Plan Cards */
    .meal-card, .note-card {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 16px;
      margin-bottom: 12px;
      box-shadow: var(--shadow-sm);
    }

    .meal-card.clickable-meal {
      cursor: pointer;
      transition: background 0.14s ease, border-color 0.14s ease;
    }

    .meal-card.clickable-meal:active {
      background: var(--bg-card-hover);
    }

    .meal-recipe-link {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid var(--border-subtle);
      color: var(--accent);
      font-size: 0.88rem;
      font-weight: 700;
    }

    .meal-day-tag {
      display: inline-block;
      font-size: 0.75rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--accent);
      background: var(--accent-soft);
      padding: 3px 9px;
      border-radius: 999px;
      margin-bottom: 8px;
    }

    .meal-title {
      font-size: 1.15rem;
      font-weight: 700;
      margin: 0 0 8px 0;
    }

    .meal-notes {
      font-size: 0.92rem;
      color: var(--text-secondary);
      margin: 8px 0 4px;
    }

    /* Bottom Navigation */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 40;
      background: var(--bg-elevated);
      border-top: 1px solid var(--border-subtle);
      padding-bottom: var(--safe-bottom);
      box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.25);
    }

    .bottom-nav-inner {
      max-width: 540px;
      margin: 0 auto;
      height: 66px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      padding: 0 6px;
    }

    .nav-tab {
      border: none;
      background: transparent;
      color: var(--text-muted);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      font-size: 0.75rem;
      font-weight: 700;
      cursor: pointer;
      position: relative;
      transition: color 0.15s ease;
    }

    .nav-tab .nav-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 30px;
      padding: 0 16px;
      border-radius: 999px;
      transition: background 0.15s ease, color 0.15s ease;
    }

    .nav-tab .nav-icon svg {
      width: 20px;
      height: 20px;
      stroke-width: 2.1;
    }

    .nav-tab.active {
      color: var(--text-primary);
    }

    .nav-tab.active .nav-icon {
      background: var(--accent-soft);
      color: var(--accent);
    }

    /* Modal */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.68);
      z-index: 60;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal-card {
      width: 100%;
      max-width: 440px;
      background: var(--bg-elevated);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: 20px;
      box-shadow: var(--shadow-lg);
      max-height: 88dvh;
      overflow-y: auto;
    }

    .modal-title {
      font-size: 1.15rem;
      font-weight: 800;
      margin: 0 0 12px 0;
    }

    .form-group {
      margin-bottom: 12px;
    }

    .form-label {
      display: block;
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--text-secondary);
      margin-bottom: 5px;
    }

    .form-textarea {
      width: 100%;
      min-height: 96px;
      padding: 12px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border-subtle);
      background: var(--bg-input);
      color: var(--text-primary);
      font-family: inherit;
      font-size: 0.95rem;
      resize: vertical;
    }

    .empty-state {
      text-align: center;
      padding: 36px 20px;
      color: var(--text-muted);
      font-size: 0.95rem;
    }
  </style>
</head>
<body>
  <!-- Top Bar -->
  <header class="top-bar">
    <div class="top-bar-inner">
      <div class="brand-group">
        <span class="brand-title" id="header-title">Groceries</span>
        <div class="sync-pill" id="sync-pill" title="Sync status">
          <span class="sync-dot"></span>
          <span id="sync-text">Link Sync</span>
        </div>
      </div>
      <div class="header-actions">
        <button type="button" class="header-add-btn" id="header-add-btn" data-action="header-contextual-add">+ Add</button>
        <button type="button" class="wake-btn" id="wake-btn" title="Keep screen awake" aria-label="Keep screen awake">
          <svg id="wake-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="4"></circle>
            <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"></path>
          </svg>
        </button>
        <button type="button" class="icon-btn" id="settings-btn" title="Settings &amp; Sync" aria-label="Settings">⚙</button>
      </div>
    </div>
  </header>

  <main class="app-shell" id="app-shell">
    <!-- 1. GROCERY LIST VIEW -->
    <section class="view-container active" id="view-grocery">
      <div class="progress-card">
        <div class="progress-header">
          <div>
            <span id="grocery-progress-text">0 of 0 checked</span>
            <span style="margin:0 5px; opacity:0.4;">•</span>
            <span id="grocery-remaining-text" style="color:var(--accent);">0 left</span>
          </div>
          <button type="button" class="step-done-btn" style="height:32px; padding:0 11px; font-size:0.76rem;" id="toggle-hide-checked-btn">Hide Checked</button>
        </div>
        <div class="progress-track">
          <div class="progress-fill" id="grocery-progress-fill"></div>
        </div>
      </div>

      <form class="quick-add-bar" id="grocery-add-form">
        <input type="text" class="quick-input" id="grocery-input" placeholder="Add item (e.g., 2 avocados)…" required />
        <select class="quick-select" id="grocery-section-select" title="Store section (auto-detected as you type)">
          <option value="Produce">Produce</option>
          <option value="Dairy & Eggs">Dairy &amp; Eggs</option>
          <option value="Frozen & Refrigerated">Frozen/Refrig</option>
          <option value="Dry Goods / Pantry">Dry Goods</option>
          <option value="Bakery & Bread">Bakery</option>
          <option value="Household / Other">Household</option>
        </select>
        <button type="submit" class="btn-primary">+</button>
      </form>

      <div id="grocery-sections-container"></div>

      <div class="list-footer-bar">
        <button type="button" class="btn-secondary danger" id="clear-checked-btn">Clear Checked Items</button>
      </div>
    </section>

    <!-- 2. COOK / RECIPE GALLERY & KITCHEN COUNTER VIEW -->
    <section class="view-container" id="view-cook">
      <div id="recipe-gallery-view">
        <div style="margin-bottom:10px;">
          <input type="search" class="quick-input" style="width:100%;" id="recipe-search-input" placeholder="🔍 Search recipes or ingredients…" />
        </div>
        <div class="recipe-switcher" id="recipe-category-pills"></div>
        <div id="recipe-gallery-list"></div>
      </div>
      <div id="recipe-detail-view" style="display:none;">
        <div id="recipe-content"></div>
      </div>
    </section>

    <!-- 3. MEAL PLAN VIEW -->
    <section class="view-container" id="view-meals">
      <div id="meals-container"></div>
    </section>

    <!-- 4. NOTES VIEW -->
    <section class="view-container" id="view-notes">
      <div id="notes-container"></div>
    </section>
  </main>

  <!-- Undo Snackbar Toast -->
  <div class="undo-toast" id="undo-toast">
    <span id="undo-toast-text">Deleted</span>
    <button type="button" class="undo-btn" data-action="undo-last-delete">Undo</button>
  </div>

  <!-- Floating Kitchen Timer Dock -->
  <div class="timer-dock" id="timer-dock"></div>

  <!-- Bottom Navigation (Crisp Custom Stroke SVGs) -->
  <nav class="bottom-nav">
    <div class="bottom-nav-inner">
      <button class="nav-tab active" data-view="grocery">
        <span class="nav-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="9" cy="20" r="1.5"></circle>
            <circle cx="17" cy="20" r="1.5"></circle>
            <path d="M3 4h2l2.4 11.2a2 2 0 0 0 2 1.6h8.8a2 2 0 0 0 1.9-1.4L22 7H6"></path>
          </svg>
        </span>
        <span>Grocery</span>
      </button>
      <button class="nav-tab" data-view="cook">
        <span class="nav-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 13.87A4 4 0 0 1 7.41 6a5.11 5.11 0 0 1 1.05-1.54 5 5 0 0 1 7.08 0A5.11 5.11 0 0 1 16.59 6 4 4 0 0 1 18 13.87V21H6Z"></path>
            <line x1="6" y1="17" x2="18" y2="17"></line>
          </svg>
        </span>
        <span>Cook</span>
      </button>
      <button class="nav-tab" data-view="meals">
        <span class="nav-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="4" width="18" height="17" rx="2"></rect>
            <line x1="16" y1="2" x2="16" y2="6"></line>
            <line x1="8" y1="2" x2="8" y2="6"></line>
            <line x1="3" y1="10" x2="21" y2="10"></line>
          </svg>
        </span>
        <span>Meals</span>
      </button>
      <button class="nav-tab" data-view="notes">
        <span class="nav-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
            <polyline points="14 2 14 8 20 8"></polyline>
            <line x1="8" y1="13" x2="16" y2="13"></line>
            <line x1="8" y1="17" x2="13" y2="17"></line>
          </svg>
        </span>
        <span>Notes</span>
      </button>
    </div>
  </nav>

  <!-- Settings / Connection Modal -->
  <div class="modal-backdrop" id="settings-modal">
    <div class="modal-card">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;">
        <h3 class="modal-title" style="margin:0;">Settings</h3>
        <button type="button" class="step-done-btn" style="height:34px; padding:0 12px;" data-action="sync-now">↻ Sync Now</button>
      </div>
      <div class="form-group">
        <label class="form-label">Appearance</label>
        <button type="button" class="btn-secondary" style="width:100%; height:42px;" id="theme-btn">◐ Switch Dark / Light Theme</button>
      </div>
      <div class="form-group">
        <label class="form-label">Sync Connection</label>
        <div id="settings-status-box" style="padding:10px 12px; border-radius:10px; background:var(--bg-input); font-size:0.85rem;"></div>
      </div>
      <div class="form-group">
        <label class="form-label">Timer Alert</label>
        <button type="button" class="btn-secondary" style="width:100%; height:42px;" data-action="test-timer-alert">🔔 Test Gentle Chime &amp; Vibration</button>
      </div>
      <div class="form-group">
        <label class="form-label">Connection Link (only needed once)</label>
        <input type="text" class="quick-input" style="width:100%;" id="manual-connect-input" placeholder="Paste #connect=... code or link" />
      </div>
      <div style="display:flex; gap:8px; margin-top:16px;">
        <button type="button" class="btn-primary" style="flex:1;" data-action="save-manual-connect">Save &amp; Sync</button>
        <button type="button" class="btn-secondary" style="flex:1;" data-action="close-modals">Close</button>
      </div>
    </div>
  </div>

  <!-- Add Meal Modal -->
  <div class="modal-backdrop" id="add-meal-modal">
    <div class="modal-card">
      <h3 class="modal-title">Add Planned Meal</h3>
      <form id="add-meal-form">
        <div class="form-group">
          <label class="form-label">Day / Label</label>
          <input type="text" class="quick-input" style="width:100%;" id="meal-day-input" placeholder="e.g., Tonight, Thursday, Weekend" required />
        </div>
        <div class="form-group">
          <label class="form-label">Link Recipe (Optional)</label>
          <select class="quick-select" style="width:100%;" id="meal-recipe-select">
            <option value="">— Custom / Unlinked Meal —</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Meal Name</label>
          <input type="text" class="quick-input" style="width:100%;" id="meal-name-input" placeholder="e.g., Paneer Makhani with Garlic Naan" required />
        </div>
        <div class="form-group">
          <label class="form-label">Time Estimate (Optional)</label>
          <input type="text" class="quick-input" style="width:100%;" id="meal-time-input" placeholder="e.g., 55m total" />
        </div>
        <div class="form-group">
          <label class="form-label">Notes</label>
          <textarea class="form-textarea" id="meal-notes-input" placeholder="Ingredients to use up, sides, etc."></textarea>
        </div>
        <div style="display:flex; gap:8px;">
          <button type="submit" class="btn-primary" style="flex:1;">Save Meal</button>
          <button type="button" class="btn-secondary" style="flex:1;" data-action="close-modals">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Add / Edit Note Modal -->
  <div class="modal-backdrop" id="add-note-modal">
    <div class="modal-card">
      <h3 class="modal-title" id="note-modal-title">New Note</h3>
      <form id="add-note-form">
        <input type="hidden" id="note-edit-id-input" value="" />
        <div class="form-group">
          <label class="form-label">Title</label>
          <input type="text" class="quick-input" style="width:100%;" id="note-title-input" placeholder="e.g., Kitchen Prep / Spice Restock" required />
        </div>
        <div class="form-group" id="note-type-group">
          <label class="form-label">Type</label>
          <select class="quick-select" style="width:100%;" id="note-type-input">
            <option value="checklist">Interactive Checklist (one item per line)</option>
            <option value="text">Standard Note</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label" id="note-content-label">Content</label>
          <textarea class="form-textarea" id="note-content-input" placeholder="Enter items (one per line) or note text..." required></textarea>
        </div>
        <div style="display:flex; gap:8px;">
          <button type="button" class="btn-secondary danger" id="delete-note-modal-btn" style="display:none; flex:0 0 auto; padding:0 14px;" data-action="delete-note-from-modal">Delete</button>
          <button type="submit" class="btn-primary" style="flex:1;">Save</button>
          <button type="button" class="btn-secondary" style="flex:1;" data-action="close-modals">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    /********************************************************************
     * STATE & STORAGE KEYS (Namespaced for Pocket Kitchen)
     ********************************************************************/
    const STORAGE_KEYS = {
      STATE: 'pocket_kitchen_state_v1',
      SYNC_CFG: 'pocket_kitchen_sync_cfg_v1',
      SYNC_META: 'pocket_kitchen_sync_meta_v1',
      THEME: 'pocket_kitchen_theme_v1',
      UI_PREFS: 'pocket_kitchen_ui_prefs_v1',
      TIMERS: 'pocket_kitchen_timers_v1'
    };

    const SECTION_ORDER = [
      'Produce',
      'Dairy & Eggs',
      'Frozen & Refrigerated',
      'Dry Goods / Pantry',
      'Bakery & Bread',
      'Household / Other'
    ];

    const GALLERY_CATEGORIES = [
      { id: 'all', label: 'All Recipes' },
      { id: 'pinned', label: '★ Pinned' },
      { id: 'entree', label: 'Entrees' },
      { id: 'soup', label: 'Soups & Chili' },
      { id: 'side', label: 'Salads & Sauces' },
      { id: 'sweet', label: 'Desserts & Drinks' }
    ];

    let appState = {
      grocery: [],
      recipes: [],
      meals: [],
      notes: [],
      lastSyncedAt: null
    };

    let uiPrefs = {
      activeView: 'grocery',
      hideCheckedGrocery: false,
      collapsedSections: {},
      learnedAisles: {},
      cookSubView: 'gallery', // 'gallery' | 'detail'
      cookFocusMode: false,
      focusIngredientsOpen: false,
      recipeCategoryFilter: 'all',
      recipeSearchQuery: '',
      selectedRecipeId: null,
      activeStepByRecipe: {},
      cookingProgress: {} // { [recipeId]: { servings, checkedIngredients: {}, completedSteps: {}, activeStep: 0 } }
    };

    const tabScrollPositions = {
      grocery: 0,
      cook: 0,
      meals: 0,
      notes: 0
    };

    let syncMeta = {
      seq: 0,
      dirtyRows: {

        notes: {}
      },
      deletedIds: {
        grocery: {},
        meals: {},
        notes: {}
      },
      pinnedRecipes: {} // { [recipeId]: { value: boolean, seq: number } }
    };

    let activeTimers = [];
    let expandedTimerId = null;
    let lastTimerStructureSig = '';
    let timerInterval = null;
    let kitchenAudioCtx = null;
    let wakeLockSentinel = null;
    let wakeLockDesired = false;
    let syncDebounceTimer = null;
    let isSyncInFlight = false;
    let resyncQueued = false;

    /********************************************************************
     * CLEAN CULINARY FRACTION FORMATTER & DYNAMIC SERVING SCALER
     ********************************************************************/
    const FRACTION_TABLE = [
      { dec: 0.125, str: '⅛' },
      { dec: 0.25,  str: '¼' },
      { dec: 0.333, str: '⅓' },
      { dec: 0.375, str: '⅜' },
      { dec: 0.5,   str: '½' },
      { dec: 0.625, str: '⅝' },
      { dec: 0.666, str: '⅔' },
      { dec: 0.75,  str: '¾' },
      { dec: 0.875, str: '⅞' }
    ];

    const UNICODE_FRAC_VALUES = {
      '⅛': 0.125, '¼': 0.25, '⅓': 1 / 3, '⅜': 0.375,
      '½': 0.5,   '⅝': 0.625, '⅔': 2 / 3, '¾': 0.75, '⅞': 0.875
    };

    function formatCulinaryNumber(val) {
      if (val === null || val === undefined || isNaN(val) || val <= 0) return '';
      const rounded = Math.round(val * 100) / 100;
      const whole = Math.floor(rounded + 0.04);
      const rem = rounded - whole;

      if (rem < 0.06) return whole > 0 ? String(whole) : String(rounded);
      if (rem > 0.94) return String(whole + 1);

      let bestFrac = '';
      let minDiff = 999;
      for (const f of FRACTION_TABLE) {
        const diff = Math.abs(rem - f.dec);
        if (diff < minDiff) {
          minDiff = diff;
          bestFrac = f.str;
        }
      }

      if (minDiff <= 0.06) {
        return whole > 0 ? `${whole} ${bestFrac}` : bestFrac;
      }
      return String(Math.round(val * 10) / 10);
    }

    function scaleQuantity(baseQty, baseServings, currentServings) {
      if (baseQty === null || baseQty === undefined || baseQty === '' || isNaN(Number(baseQty))) {
        return '';
      }
      const b = Number(baseServings) || 4;
      const c = Number(currentServings) || b;
      const scaled = (Number(baseQty) * c) / b;
      return formatCulinaryNumber(scaled);
    }

    function parseCulinaryNumberString(numStr) {
      let s = String(numStr || '').trim();
      if (!s) return NaN;
      for (const [ch, val] of Object.entries(UNICODE_FRAC_VALUES)) {
        if (s === ch) return val;
        if (s.includes(ch)) {
          const wholePart = parseFloat(s.replace(ch, '').trim()) || 0;
          return wholePart + val;
        }
      }
      const mixedMatch = s.match(/^(\d+)\s+(\d+)\s*\/\s*(\d+)$/);
      if (mixedMatch) {
        const denom = parseFloat(mixedMatch[3]) || 1;
        return parseFloat(mixedMatch[1]) + (parseFloat(mixedMatch[2]) / denom);
      }
      const fracMatch = s.match(/^(\d+)\s*\/\s*(\d+)$/);
      if (fracMatch) {
        const denom = parseFloat(fracMatch[2]) || 1;
        return parseFloat(fracMatch[1]) / denom;
      }
      return parseFloat(s);
    }

    function parseDurationToSeconds(timeStr) {
      const m = String(timeStr || '').match(/((?:\d+\s+\d+\/\d+|\d+\/\d+|\d+(?:\.\d+)?(?:\s*[¼½¾⅓⅔⅛⅜⅝⅞])?|[¼½¾⅓⅔⅛⅜⅝⅞])(?:\s*(?:[-–]|to)\s*(?:\d+\s+\d+\/\d+|\d+\/\d+|\d+(?:\.\d+)?(?:\s*[¼½¾⅓⅔⅛⅜⅝⅞])?|[¼½¾⅓⅔⅛⅜⅝⅞]))?)\s*(hours|hour|hrs|hr|minutes|minute|mins|min|seconds|second|secs|sec)/i);
      if (!m) return 60;
      // For ranges like "25-30 min", use the lower number (first check-in point) so nothing burns!
      const rangeParts = m[1].split(/\s*(?:[-–]|\bto\b)\s*/i);
      const primaryVal = parseCulinaryNumberString(rangeParts[0]) || 1;
      const u = m[2].toLowerCase();
      if (u.startsWith('h')) return Math.max(1, Math.round(primaryVal * 3600));
      if (u.startsWith('s')) return Math.max(1, Math.round(primaryVal));
      return Math.max(1, Math.round(primaryVal * 60));
    }

    function inferTimerActionLabel(rawText, matchStr, stepIndex, explicitStepLabel) {
      if (explicitStepLabel && String(explicitStepLabel).trim()) {
        return `${String(explicitStepLabel).trim()} (${matchStr})`;
      }
      const plain = String(rawText || '').replace(/\{\{([^}]+)\}\}/g, (_, inner) => {
        const parts = inner.split('|').map(s => s.trim());
        return parts[parts.length - 1] || '';
      });

      const sentences = plain.split(/(?<=[.!?])\s+/);
      const targetSentence = sentences.find(s => s.includes(matchStr)) || plain;
      const beforeTime = targetSentence.split(matchStr)[0] || '';

      const cleaned = beforeTime
        .replace(/\b(for|about|around|approximately|at least|another)\s*$/i, '')
        .replace(/[,;:]\s*$/, '')
        .trim();

      if (cleaned) {
        const words = cleaned.split(/\s+/);
        const shortPhrase = words.length <= 5 ? cleaned : words.slice(0, 5).join(' ') + '…';
        const cap = shortPhrase.charAt(0).toUpperCase() + shortPhrase.slice(1);
        return `${cap} (${matchStr})`;
      }
      return `Step ${stepIndex + 1} (${matchStr})`;
    }

    function shortenDurationLabel(str) {
      return String(str || '')
        .replace(/\bminutes?\b/gi, 'min')
        .replace(/\bhours?\b/gi, 'hr')
        .replace(/\bseconds?\b/gi, 'sec')
        .trim();
    }

    function extractStepTimers(stepObjOrText, stepIndex) {
      const isObj = stepObjOrText && typeof stepObjOrText === 'object';
      const rawText = isObj ? (stepObjOrText.text || '') : String(stepObjOrText || '');
      const stepTimerLabel = isObj ? (stepObjOrText.timerLabel || '') : '';
      if (!rawText) return [];

      const timers = [];
      let remaining = rawText;

      remaining = remaining.replace(/\[\[([^\]]+)\]\]/g, (_, inner) => {
        const parts = inner.split('|').map(s => s.trim());
        const durationText = parts[0] || '5 minutes';
        const customAction = parts[1] || stepTimerLabel || `Step ${stepIndex + 1}`;
        const seconds = parseDurationToSeconds(durationText);
        const fullLabel = customAction.includes('(') ? customAction : `${customAction} (${durationText})`;
        timers.push({ seconds, durationText, shortDuration: shortenDurationLabel(durationText), fullLabel });
        return '';
      });

      const durationRegex = /(?:^|(?<=\s))((?:\d+\s+\d+\/\d+|\d+\/\d+|\d+(?:\.\d+)?(?:\s*[¼½¾⅓⅔⅛⅜⅝⅞])?|[¼½¾⅓⅔⅛⅜⅝⅞])(?:\s*(?:[-–]|to)\s*(?:\d+\s+\d+\/\d+|\d+\/\d+|\d+(?:\.\d+)?(?:\s*[¼½¾⅓⅔⅛⅜⅝⅞])?|[¼½¾⅓⅔⅛⅜⅝⅞]))?)\s*(hours|hour|hrs|hr|minutes|minute|mins|min|seconds|second|secs|sec)\b/gi;
      remaining.replace(durationRegex, (match) => {
        const seconds = parseDurationToSeconds(match);
        const fullLabel = inferTimerActionLabel(rawText, match, stepIndex, stepTimerLabel);
        timers.push({ seconds, durationText: match, shortDuration: shortenDurationLabel(match), fullLabel });
        return match;
      });

      return timers;
    }

    function renderStepTextWithScalingAndTimers(stepObjOrText, baseServings, currentServings, stepIndex, options = {}) {
      const includeTimerChips = options.includeTimerChips !== false;
      const isObj = stepObjOrText && typeof stepObjOrText === 'object';
      const rawText = isObj ? (stepObjOrText.text || '') : String(stepObjOrText || '');
      const stepTimerLabel = isObj ? (stepObjOrText.timerLabel || '') : '';
      if (!rawText) return '';

      let html = escapeHtml(rawText);

      // 1. Replace {{qty|unit|item}} or {{qty:1|unit:tsp|label:cumin}} tokens with scaled inline badges
      html = html.replace(/\{\{([^}]+)\}\}/g, (_, inner) => {
        const parts = inner.split('|').map(s => s.trim());
        let qty = null, unit = '', label = '';
        if (parts[0] && parts[0].includes(':')) {
          for (const p of parts) {
            const [k, v] = p.split(':').map(x => x.trim());
            if (k === 'qty') qty = parseFloat(v);
            else if (k === 'unit') unit = v;
            else if (k === 'label' || k === 'item') label = v;
          }
        } else {
          qty = parseFloat(parts[0]);
          unit = parts[1] || '';
          label = parts[2] || '';
        }
        const scaledStr = isNaN(qty) ? parts[0] : scaleQuantity(qty, baseServings, currentServings);
        const combined = [scaledStr, unit, label].filter(Boolean).join(' ');
        return `<span class="inline-qty">${combined}</span>`;
      });

      if (!includeTimerChips) {
        // In Focus Mode, strip [[duration|label]] brackets into clean readable text; big buttons sit below
        return html.replace(/\[\[([^\]]+)\]\]/g, (_, inner) => {
          const parts = inner.split('|').map(s => s.trim());
          return `<strong>${parts[0] || ''}</strong>`;
        });
      }

      // 2. Replace explicit labeled timers [[15 minutes|Soak cashews]] first using placeholders
      const explicitTimerPlaceholders = [];
      html = html.replace(/\[\[([^\]]+)\]\]/g, (_, inner) => {
        const parts = inner.split('|').map(s => s.trim());
        const durationText = parts[0] || '5 minutes';
        const customAction = parts[1] || escapeHtml(stepTimerLabel) || `Step ${stepIndex + 1}`;
        const seconds = parseDurationToSeconds(durationText);
        const fullLabel = customAction.includes('(') ? customAction : `${customAction} (${durationText})`;
        const chipHtml = `<button type="button" class="timer-chip" data-action="start-timer" data-seconds="${seconds}" data-label="${fullLabel}">⏱ ${durationText}</button>`;
        const token = `__TIMER_CHIP_${explicitTimerPlaceholders.length}__`;
        explicitTimerPlaceholders.push(chipHtml);
        return token;
      });

      // 3. Auto-detect any remaining plain-text time mentions (including "1 1/2 hours", "hrs", "25-30 min")
      const durationRegex = /(?:^|(?<=\s))((?:\d+\s+\d+\/\d+|\d+\/\d+|\d+(?:\.\d+)?(?:\s*[¼½¾⅓⅔⅛⅜⅝⅞])?|[¼½¾⅓⅔⅛⅜⅝⅞])(?:\s*(?:[-–]|to)\s*(?:\d+\s+\d+\/\d+|\d+\/\d+|\d+(?:\.\d+)?(?:\s*[¼½¾⅓⅔⅛⅜⅝⅞])?|[¼½¾⅓⅔⅛⅜⅝⅞]))?)\s*(hours|hour|hrs|hr|minutes|minute|mins|min|seconds|second|secs|sec)\b/gi;
      html = html.replace(durationRegex, (match) => {
        const seconds = parseDurationToSeconds(match);
        const safeLabel = escapeHtml(inferTimerActionLabel(rawText, match, stepIndex, stepTimerLabel));
        return `<button type="button" class="timer-chip" data-action="start-timer" data-seconds="${seconds}" data-label="${safeLabel}">⏱ ${match}</button>`;
      });

      explicitTimerPlaceholders.forEach((chip, i) => {
        html = html.replace(`__TIMER_CHIP_${i}__`, chip);
      });

      return html;
    }

    function escapeHtml(str) {
      return String(str ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    /********************************************************************
     * SCREEN WAKE LOCK API (Shopping & Cooking Mode)
     ********************************************************************/
    async function requestWakeLock() {
      if (!('wakeLock' in navigator)) return false;
      try {
        wakeLockSentinel = await navigator.wakeLock.request('screen');
        wakeLockSentinel.addEventListener('release', () => {
          updateWakeButtonUI();
        });
        updateWakeButtonUI();
        return true;
      } catch (err) {
        updateWakeButtonUI();
        return false;
      }
    }

    async function toggleWakeLock() {
      wakeLockDesired = !wakeLockDesired;
      if (wakeLockDesired) {
        await requestWakeLock();
      } else if (wakeLockSentinel) {
        await wakeLockSentinel.release();
        wakeLockSentinel = null;
      }
      updateWakeButtonUI();
    }

    function updateWakeButtonUI() {
      const btn = document.getElementById('wake-btn');
      const iconCircle = document.querySelector('#wake-icon circle');
      const isLocked = Boolean(wakeLockSentinel && !wakeLockSentinel.released);
      const isOn = wakeLockDesired || isLocked;
      if (btn) {
        btn.classList.toggle('active', isOn);
        btn.setAttribute('title', isOn ? 'Screen awake ON (tap to turn off)' : 'Keep screen awake');
      }
      if (iconCircle) {
        iconCircle.setAttribute('fill', isOn ? 'currentColor' : 'none');
      }
    }

    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible' && wakeLockDesired) {
        requestWakeLock();
      }
    });

    /********************************************************************
     * FLOATING KITCHEN TIMERS + WARM CHIME & NATIVE HAPTIC NOTIFICATION
     ********************************************************************/
    function ensureAudioAndNotificationsUnlocked() {
      try {
        if (!kitchenAudioCtx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) kitchenAudioCtx = new AudioCtx();
        }
        if (kitchenAudioCtx && kitchenAudioCtx.state === 'suspended') {
          kitchenAudioCtx.resume();
        }
      } catch (e) {}

      // Request notification permission on user gesture so Service Worker can vibrate Android when timer ends
      try {
        if ('Notification' in window && Notification.permission === 'default') {
          Notification.requestPermission().catch(() => {});
        }
      } catch (e) {}
    }

    function saveTimersToStorage() {
      try {
        localStorage.setItem(STORAGE_KEYS.TIMERS, JSON.stringify(activeTimers));
      } catch (e) {}
    }

    function loadTimersFromStorage() {
      try {
        const raw = localStorage.getItem(STORAGE_KEYS.TIMERS);
        if (!raw) return;
        const parsed = JSON.parse(raw);
        if (!Array.isArray(parsed)) return;
        const now = Date.now();
        activeTimers = parsed.map(t => {
          if (t.running && !t.finished && t.endTime) {
            const rem = Math.max(0, Math.ceil((t.endTime - now) / 1000));
            return Object.assign({}, t, {
              remainingSeconds: rem,
              finished: rem === 0,
              running: rem > 0
            });
          }
          return t;
        });
        if (activeTimers.length > 0) {
          ensureTimerLoop();
          renderTimers();
        }
      } catch (e) {}
    }

    function startKitchenTimer(durationSeconds, label) {
      ensureAudioAndNotificationsUnlocked();
      try {
        if (navigator.vibrate) navigator.vibrate(35);
      } catch (e) {}

      const now = Date.now();
      const id = 't-' + now + '-' + Math.random().toString(36).slice(2, 6);
      activeTimers.push({
        id,
        label,
        totalSeconds: durationSeconds,
        remainingSeconds: durationSeconds,
        endTime: now + durationSeconds * 1000,
        running: true,
        finished: false,
        lastAlertAt: 0
      });
      saveTimersToStorage();
      ensureTimerLoop();
      renderTimers();
    }

    function ensureTimerLoop() {
      if (timerInterval) return;
      timerInterval = setInterval(() => {
        const now = Date.now();
        let anyChanged = false;
        let stateMutated = false;
        for (const t of activeTimers) {
          if (t.running && !t.finished) {
            if (!t.endTime) t.endTime = now + (t.remainingSeconds || 0) * 1000;
            const nextRem = Math.max(0, Math.ceil((t.endTime - now) / 1000));
            if (nextRem !== t.remainingSeconds) {
              t.remainingSeconds = nextRem;
              anyChanged = true;
              if (t.remainingSeconds === 0) {
                t.finished = true;
                t.running = false;
                t.endTime = null;
                t.lastAlertAt = now;
                if (expandedTimerId === t.id) expandedTimerId = null;
                stateMutated = true;
                playGentleKitchenChime();
                triggerSystemHapticNotification(t);
              }
            }
          } else if (t.finished && now - (t.lastAlertAt || 0) >= 4500) {
            t.lastAlertAt = now;
            playGentleKitchenChime();
            triggerSystemHapticNotification(t);
          }
        }
        if (stateMutated) saveTimersToStorage();
        if (activeTimers.length === 0) {
          clearInterval(timerInterval);
          timerInterval = null;
        }
        if (anyChanged) renderTimers();
      }, 300);
    }

    function playGentleKitchenChime() {
      try {
        if (navigator.vibrate) {
          navigator.vibrate([240, 110, 240, 110, 380]);
        }
        ensureAudioAndNotificationsUnlocked();
        if (!kitchenAudioCtx) return;

        const compressor = kitchenAudioCtx.createDynamicsCompressor();
        compressor.threshold.setValueAtTime(-14, kitchenAudioCtx.currentTime);
        compressor.ratio.setValueAtTime(3, kitchenAudioCtx.currentTime);
        compressor.connect(kitchenAudioCtx.destination);

        // Warm marimba/bell triad (C5 -> E5 -> G5 -> C6) — louder & richer with sine + triangle harmonic
        const notes = [
          { freq: 523.25, delay: 0.00, dur: 0.52, peak: 0.34 },
          { freq: 659.25, delay: 0.17, dur: 0.52, peak: 0.34 },
          { freq: 783.99, delay: 0.34, dur: 0.62, peak: 0.36 },
          { freq: 1046.50, delay: 0.52, dur: 0.95, peak: 0.32 }
        ];

        const baseTime = kitchenAudioCtx.currentTime;
        notes.forEach(n => {
          // Fundamental sine
          const osc1 = kitchenAudioCtx.createOscillator();
          const gain1 = kitchenAudioCtx.createGain();
          osc1.type = 'sine';
          osc1.frequency.setValueAtTime(n.freq, baseTime + n.delay);
          gain1.gain.setValueAtTime(0.0001, baseTime + n.delay);
          gain1.gain.linearRampToValueAtTime(n.peak, baseTime + n.delay + 0.035);
          gain1.gain.exponentialRampToValueAtTime(0.0001, baseTime + n.delay + n.dur);
          osc1.connect(gain1);
          gain1.connect(compressor);
          osc1.start(baseTime + n.delay);
          osc1.stop(baseTime + n.delay + n.dur + 0.03);

          // Warm triangle body harmonic (adds mid-range presence on phone speakers)
          const osc2 = kitchenAudioCtx.createOscillator();
          const gain2 = kitchenAudioCtx.createGain();
          osc2.type = 'triangle';
          osc2.frequency.setValueAtTime(n.freq, baseTime + n.delay);
          gain2.gain.setValueAtTime(0.0001, baseTime + n.delay);
          gain2.gain.linearRampToValueAtTime(n.peak * 0.45, baseTime + n.delay + 0.035);
          gain2.gain.exponentialRampToValueAtTime(0.0001, baseTime + n.delay + n.dur * 0.75);
          osc2.connect(gain2);
          gain2.connect(compressor);
          osc2.start(baseTime + n.delay);
          osc2.stop(baseTime + n.delay + n.dur + 0.03);
        });
      } catch (e) {}
    }

    function triggerSystemHapticNotification(timer) {
      try {
        if (!('serviceWorker' in navigator) || !('Notification' in window)) return;
        if (Notification.permission !== 'granted') return;
        navigator.serviceWorker.ready.then(reg => {
          reg.showNotification(`🔔 Timer Done: ${timer.label}`, {
            body: 'Tap OK in Pocket Kitchen to dismiss timer.',
            icon: 'icon.svg',
            badge: 'icon.svg',
            tag: 'pocket-timer-' + timer.id,
            renotify: true,
            requireInteraction: true,
            vibrate: [280, 120, 280, 120, 420]
          }).catch(() => {});
        });
      } catch (e) {}
    }

    function clearSystemTimerNotification(timerId) {
      try {
        if (!('serviceWorker' in navigator)) return;
        navigator.serviceWorker.ready.then(reg => {
          if (reg.getNotifications) {
            reg.getNotifications({ tag: 'pocket-timer-' + timerId }).then(list => {
              list.forEach(n => n.close());
            }).catch(() => {});
          }
        });
      } catch (e) {}
    }

    function testTimerChimeAndBuzz() {
      ensureAudioAndNotificationsUnlocked();
      playGentleKitchenChime();
      triggerSystemHapticNotification({ id: 'test', label: 'Sample Timer (Test)' });
    }

    function formatClock(sec) {
      const m = Math.floor(sec / 60);
      const s = sec % 60;
      return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
    }

    function toggleTimerExpand(id) {
      const t = activeTimers.find(x => x.id === id);
      if (!t || t.finished) return;
      expandedTimerId = expandedTimerId === id ? null : id;
      renderTimers(true);
    }

    function toggleTimerPause(id) {
      const t = activeTimers.find(x => x.id === id);
      if (!t) return;
      if (t.finished) {
        dismissTimer(id);
        return;
      }
      if (t.running) {
        t.remainingSeconds = Math.max(0, Math.ceil(((t.endTime || Date.now()) - Date.now()) / 1000));
        t.running = false;
        t.endTime = null;
      } else {
        t.running = true;
        t.endTime = Date.now() + (t.remainingSeconds || 0) * 1000;
      }
      saveTimersToStorage();
      renderTimers(true);
    }

    function addMinuteToTimer(id) {
      const t = activeTimers.find(x => x.id === id);
      if (!t) return;
      clearSystemTimerNotification(id);
      const baseRem = t.running && t.endTime
        ? Math.max(0, Math.ceil((t.endTime - Date.now()) / 1000))
        : (t.remainingSeconds || 0);
      t.remainingSeconds = baseRem + 60;
      t.endTime = Date.now() + t.remainingSeconds * 1000;
      t.finished = false;
      t.running = true;
      saveTimersToStorage();
      ensureTimerLoop();
      renderTimers(true);
    }

    function dismissTimer(id) {
      clearSystemTimerNotification(id);
      if (expandedTimerId === id) expandedTimerId = null;
      activeTimers = activeTimers.filter(x => x.id !== id);
      saveTimersToStorage();
      renderTimers(true);
    }

    function renderTimers(forceRebuild = false) {
      const dock = document.getElementById('timer-dock');
      if (activeTimers.length === 0) {
        if (lastTimerStructureSig !== '') {
          dock.innerHTML = '';
          lastTimerStructureSig = '';
          document.documentElement.style.setProperty('--timer-dock-offset', '0px');
        }
        return;
      }

      // Sort finished first, then soonest-remaining first
      const sortedTimers = [...activeTimers].sort((a, b) => {
        if (a.finished !== b.finished) return a.finished ? -1 : 1;
        return (a.remainingSeconds || 0) - (b.remainingSeconds || 0);
      });

      const sig = sortedTimers
        .map(t => `${t.id}:${t.running ? 1 : 0}:${t.finished ? 1 : 0}:${expandedTimerId === t.id ? 1 : 0}`)
        .join('|');

      // Fast path on 1-second ticks: update countdown text only so buttons are NEVER destroyed mid-tap!
      if (!forceRebuild && sig === lastTimerStructureSig) {
        for (const t of sortedTimers) {
          if (!t.finished) {
            const clockEl = document.getElementById('timer-clock-' + t.id);
            if (clockEl) clockEl.textContent = formatClock(t.remainingSeconds);
          }
        }
        return;
      }

      lastTimerStructureSig = sig;
      dock.innerHTML = sortedTimers.map(t => {
        if (t.finished) {
          return `
            <div class="timer-bar finished">
              <div class="timer-bar-main">
                <div style="display:flex; align-items:center; gap:9px; min-width:0; flex:1;">
                  <span class="timer-countdown" id="timer-clock-${escapeHtml(t.id)}">🔔 Done!</span>
                  <span style="font-size:0.9rem; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${escapeHtml(t.label)}</span>
                </div>

    /********************************************************************
     * APPS SCRIPT (@OnlyCurrentDoc) ROW-LEVEL DELTA SYNC ENGINE
     ********************************************************************/
    function getSyncConfig() {
      try {
        const raw = localStorage.getItem(STORAGE_KEYS.SYNC_CFG);
        if (!raw) return null;
        const parsed = JSON.parse(raw);
        // Automatically purge any legacy broad-scope OAuth credentials from localStorage
        if (parsed && (parsed.rt || parsed.cs || parsed.cid) && !parsed.webhookUrl) {
          localStorage.removeItem(STORAGE_KEYS.SYNC_CFG);
          return null;
        }
        if (parsed && parsed.webhookUrl && parsed.key) {
          return { webhookUrl: parsed.webhookUrl, key: parsed.key };
        }
        return null;
      } catch (e) {
        return null;
      }
    }

    function saveSyncConfig(cfg) {
      const cleanCfg = {
        webhookUrl: String(cfg.webhookUrl || '').trim(),
        key: String(cfg.key || '').trim()
      };
      localStorage.setItem(STORAGE_KEYS.SYNC_CFG, JSON.stringify(cleanCfg));
      updateSyncUI('synced', 'Synced');
    }

    function decodeBase64UrlJson(str) {
      const base64 = str.replace(/-/g, '+').replace(/_/g, '/');
      const padded = base64 + '==='.slice((base64.length + 3) % 4);
      const binary = atob(padded);
      const bytes = Uint8Array.from(binary, c => c.charCodeAt(0));
      return JSON.parse(new TextDecoder().decode(bytes));
    }

    function checkUrlHashForConnection() {
      const hash = window.location.hash || '';
      if (hash.startsWith('#connect=')) {
        const tokenPart = hash.slice('#connect='.length).trim();
        try {
          const cfg = decodeBase64UrlJson(tokenPart);
          if (cfg && cfg.webhookUrl && cfg.key) {
            saveSyncConfig(cfg);
            history.replaceState(null, '', window.location.pathname + window.location.search);
            return true;
          }
        } catch (err) {
          console.error('Invalid connection payload:', err);
        }
      }
      return false;
    }

    function updateSyncUI(status, text) {
      const pill = document.getElementById('sync-pill');
      const label = document.getElementById('sync-text');
      if (!pill || !label) return;
      pill.className = 'sync-pill ' + status;
      label.textContent = text;
    }

    function nextSyncSeq() {
      syncMeta.seq = (Number(syncMeta.seq) || 0) + 1;
      return syncMeta.seq;
    }

    function markRowDirty(tabName, id) {
      if (!tabName || !id) return;
      if (!syncMeta.dirtyRows[tabName]) syncMeta.dirtyRows[tabName] = {};
      if (!syncMeta.deletedIds[tabName]) syncMeta.deletedIds[tabName] = {};
      syncMeta.dirtyRows[tabName][id] = nextSyncSeq();
      delete syncMeta.deletedIds[tabName][id];
      saveLocalState();
    }

    function recordDeletedId(tabName, id) {
      if (!tabName || !id) return;
      if (!syncMeta.dirtyRows[tabName]) syncMeta.dirtyRows[tabName] = {};
      if (!syncMeta.deletedIds[tabName]) syncMeta.deletedIds[tabName] = {};
      syncMeta.deletedIds[tabName][id] = nextSyncSeq();
      delete syncMeta.dirtyRows[tabName][id];
      saveLocalState();
    }

    function unrecordDeletedId(tabName, id) {
      if (!tabName || !id) return;
      if (syncMeta.deletedIds && syncMeta.deletedIds[tabName]) {
        delete syncMeta.deletedIds[tabName][id];
      }
      markRowDirty(tabName, id);
    }

    function markRecipePinDirty(recipeId, activeBool) {
      if (!recipeId) return;
      if (!syncMeta.pinnedRecipes) syncMeta.pinnedRecipes = {};
      syncMeta.pinnedRecipes[recipeId] = {
        value: Boolean(activeBool),
        seq: nextSyncSeq()
      };
      saveLocalState();
    }

    function hasAnyPendingSync() {
      for (const tab of ['grocery', 'meals', 'notes']) {
        if (Object.keys(syncMeta.dirtyRows[tab] || {}).length > 0) return true;
        if (Object.keys(syncMeta.deletedIds[tab] || {}).length > 0) return true;
      }
      if (Object.keys(syncMeta.pinnedRecipes || {}).length > 0) return true;
      return false;
    }

    function getPendingSyncSummary() {
      const parts = [];
      for (const tab of ['grocery', 'meals', 'notes']) {
        const n = Object.keys(syncMeta.dirtyRows[tab] || {}).length + Object.keys(syncMeta.deletedIds[tab] || {}).length;
        if (n > 0) parts.push(`${tab} (${n})`);
      }
      const p = Object.keys(syncMeta.pinnedRecipes || {}).length;
      if (p > 0) parts.push(`pins (${p})`);
      return parts.join(', ');
    }

    function applyLocalPendingOverlay(remoteList, localList, dirtyMap, deletedMap) {
      const dMap = dirtyMap || {};
      const delMap = deletedMap || {};
      const localById = new Map((localList || []).map(item => [item.id, item]));
      const result = [];
      const seen = new Set();

      for (const rem of (remoteList || [])) {
        if (delMap[rem.id]) continue;
        if (dMap[rem.id] && localById.has(rem.id)) {
          result.push(localById.get(rem.id));
        } else {
          result.push(rem);
        }
        seen.add(rem.id);
      }

      for (const [id] of Object.entries(dMap)) {
        if (!seen.has(id) && !delMap[id] && localById.has(id)) {
          result.push(localById.get(id));
        }
      }

      return result;
    }

    async function syncWithGoogleSheets(options = {}) {
      const cfg = getSyncConfig();
      if (!cfg || !cfg.webhookUrl || !cfg.key) {
        updateSyncUI('unlinked', 'Link Sync');
        return;
      }

      if (isSyncInFlight) {
        resyncQueued = true;
        return;
      }

      isSyncInFlight = true;
      const hadDirtyAtStart = hasAnyPendingSync();
      if (!options.silent || hadDirtyAtStart) {
        updateSyncUI('syncing', hadDirtyAtStart ? 'Saving…' : 'Syncing…');
      }

      // Snapshot exact row sequence numbers being uploaded in this request
      const sentDirty = { grocery: {}, meals: {}, notes: {} };
      const sentDeletes = { grocery: {}, meals: {}, notes: {} };
      const sentPins = {};
      const changes = {};

      for (const tab of ['grocery', 'meals', 'notes']) {
        const upserts = [];
        const deletes = [];
        const localById = new Map((appState[tab] || []).map(x => [x.id, x]));

        for (const [id, seq] of Object.entries(syncMeta.dirtyRows[tab] || {})) {
          if (localById.has(id)) {
            sentDirty[tab][id] = seq;
            upserts.push(localById.get(id));
          } else {
            delete syncMeta.dirtyRows[tab][id];
          }
        }
        for (const [id, seq] of Object.entries(syncMeta.deletedIds[tab] || {})) {
          sentDeletes[tab][id] = seq;
          deletes.push(id);
        }
        if (upserts.length > 0 || deletes.length > 0) {
          changes[tab] = { upserts, deletes };
        }
      }

      const pinEntries = Object.entries(syncMeta.pinnedRecipes || {});
      if (pinEntries.length > 0) {
        changes.recipes = { pinned: {} };
        for (const [id, entry] of pinEntries) {
          const val = (entry && typeof entry === 'object') ? Boolean(entry.value) : Boolean(entry);
          const seq = (entry && typeof entry === 'object') ? (entry.seq || 0) : 0;
          sentPins[id] = seq;
          changes.recipes.pinned[id] = val;
        }
      }

      let syncFailed = false;
      try {
        // Use text/plain simple request so Google Apps Script executes with zero CORS preflight
        const resp = await fetch(cfg.webhookUrl, {
          method: 'POST',
          redirect: 'follow',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ key: cfg.key, changes })
        });
        if (!resp.ok) throw new Error(`Sync HTTP ${resp.status}`);
        const data = await resp.json();
        if (!data || data.ok !== true) {
          throw new Error((data && data.error) || 'Invalid sync response');
        }

        // Clear ONLY row flags that were NOT modified again while the HTTP request was in flight
        for (const tab of ['grocery', 'meals', 'notes']) {
          for (const [id, sentSeq] of Object.entries(sentDirty[tab])) {
            if ((syncMeta.dirtyRows[tab][id] || 0) <= sentSeq) {
              delete syncMeta.dirtyRows[tab][id];
            }
          }
          for (const [id, sentSeq] of Object.entries(sentDeletes[tab])) {
            if ((syncMeta.deletedIds[tab][id] || 0) <= sentSeq) {
              delete syncMeta.deletedIds[tab][id];
            }
          }
        }
        for (const [id, sentSeq] of Object.entries(sentPins)) {
          const cur = syncMeta.pinnedRecipes[id];
          const curSeq = (cur && typeof cur === 'object') ? (cur.seq || 0) : 0;
          if (curSeq <= sentSeq) {
            delete syncMeta.pinnedRecipes[id];
          }
        }

        // Reconcile server state while preserving any mid-upload taps made on the phone
        if (Array.isArray(data.grocery)) {
          appState.grocery = applyLocalPendingOverlay(data.grocery, appState.grocery, syncMeta.dirtyRows.grocery, syncMeta.deletedIds.grocery);
        }
        if (Array.isArray(data.recipes) && data.recipes.length > 0) {
          appState.recipes = data.recipes.map(r => {
            if (Object.prototype.hasOwnProperty.call(syncMeta.pinnedRecipes, r.id)) {
              const p = syncMeta.pinnedRecipes[r.id];
              return Object.assign({}, r, { active: (p && typeof p === 'object') ? Boolean(p.value) : Boolean(p) });
            }
            return r;
          });
        }
        if (Array.isArray(data.meals)) {
          appState.meals = applyLocalPendingOverlay(data.meals, appState.meals, syncMeta.dirtyRows.meals, syncMeta.deletedIds.meals);
        }
        if (Array.isArray(data.notes)) {
          appState.notes = applyLocalPendingOverlay(data.notes, appState.notes, syncMeta.dirtyRows.notes, syncMeta.deletedIds.notes);
        }

        appState.lastSyncedAt = data.syncedAt || new Date().toISOString();
        saveLocalState();
        renderAll();
        if (hasAnyPendingSync()) {
          updateSyncUI('syncing', 'Saving…');
        } else {
          updateSyncUI('synced', 'Synced');
        }
      } catch (err) {
        syncFailed = true;
        console.error('Sync error:', err);
        updateSyncUI('error', hasAnyPendingSync() ? 'Saved Locally' : 'Offline');
      } finally {
        isSyncInFlight = false;
        if (resyncQueued || (!syncFailed && hasAnyPendingSync())) {
          resyncQueued = false;
          schedulePushToGoogleSheets();
        }
      }
    }

    function pullFromGoogleSheets(options = {}) {
      return syncWithGoogleSheets(options);
    }

    function schedulePushToGoogleSheets() {
      saveLocalState();
      const cfg = getSyncConfig();
      if (!cfg || !cfg.webhookUrl) {
        updateSyncUI('unlinked', 'Link Sync');
        return;
      }
      updateSyncUI('syncing', 'Saving…');
      if (syncDebounceTimer) clearTimeout(syncDebounceTimer);
      syncDebounceTimer = setTimeout(() => {
        syncWithGoogleSheets();
      }, 500);
    }

    function loadLocalState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEYS.STATE);

      } catch (e) {}
      try {
        const rawPrefs = localStorage.getItem(STORAGE_KEYS.UI_PREFS);
        if (rawPrefs) {
          uiPrefs = Object.assign(uiPrefs, JSON.parse(rawPrefs));
          if (!uiPrefs.cookingProgress) uiPrefs.cookingProgress = {};
          if (!uiPrefs.learnedAisles) uiPrefs.learnedAisles = {};
        }
      } catch (e) {}
      try {
        const rawSyncMeta = localStorage.getItem(STORAGE_KEYS.SYNC_META);
        if (rawSyncMeta) {
          const parsedMeta = JSON.parse(rawSyncMeta);
          syncMeta.seq = Number(parsedMeta.seq) || 0;
          syncMeta.dirtyRows = Object.assign({ grocery: {}, meals: {}, notes: {} }, parsedMeta.dirtyRows || {});
          syncMeta.deletedIds = Object.assign({ grocery: {}, meals: {}, notes: {} }, parsedMeta.deletedIds || {});
          syncMeta.pinnedRecipes = parsedMeta.pinnedRecipes || {};
        }
      } catch (e) {}
      // Ensure any legacy OAuth config is purged immediately on boot
      getSyncConfig();
    }
